<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>پنل مدیریت پرونده</title>
<style>
:root{--bg:#17181a;--bg2:#202124;--bg3:#2b2d31;--text:#e6e2da;--soft:#9a9890;--brass:#e0a526;--ok:#5dae7e;--bad:#d0543f;--line:#34363b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 Tahoma,Vazirmatn,system-ui,sans-serif}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0 0 0 10px;color:var(--brass)}
nav{display:flex;gap:4px;flex-wrap:wrap}
button,input,select,textarea{font:inherit;color:var(--text);background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--brass)}
nav button.on{background:var(--brass);color:#1a1a1a;border-color:var(--brass)}
.row button.on{background:var(--brass);color:#1a1a1a;border-color:var(--brass)}
button.danger{border-color:var(--bad);color:var(--bad)}
main{padding:14px;max-width:1200px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card b{display:block;font-size:22px;color:var(--brass)}.card span{color:var(--soft);font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--bg2);border-radius:10px;overflow:hidden}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{color:var(--soft);font-weight:normal;font-size:12px;background:var(--bg3)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg3)}
.tag{display:inline-block;padding:0 7px;border-radius:9px;font-size:11px;background:var(--bg3);color:var(--soft)}
.tag.solved{color:var(--ok)}.tag.failed,.tag.banned{color:var(--bad)}.tag.purchase{color:var(--brass)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
h2{font-size:15px;margin:18px 0 8px;color:var(--brass)}
.chart{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px}
.chart svg{width:100%;height:120px;display:block}
.plink{color:var(--brass);text-decoration:none;border-bottom:1px dotted var(--brass)}
.muted{color:var(--soft)}.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
#login{max-width:340px;margin:18vh auto;text-align:center}
#login input{width:100%;margin:10px 0}
.err{color:var(--bad)}
dialog{background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:12px;max-width:440px;width:92%}
dialog::backdrop{background:#000a}
dialog input,dialog textarea{width:100%;margin:4px 0 10px}
.scroll{overflow-x:auto}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.hcard{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto}.hcard h3{margin:0 0 6px;font-size:14px;color:var(--brass)}
.hcard table{background:none}.hcard .big{display:block;font-size:24px;color:var(--brass)}.hcard small{font-size:12px;color:var(--soft)}
.st{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--soft);vertical-align:middle}.st.ok{background:var(--ok)}.st.warn{background:#e0a526}.st.bad{background:var(--bad)}

/* ---- look & feel v2 ---- */
body{background:radial-gradient(1200px 500px at 85% -10%,#2a2412 0,transparent 60%),var(--bg);min-height:100vh}
header{background:linear-gradient(180deg,#26241c,#1d1e20);border-bottom:1px solid #3d3a2c;box-shadow:0 4px 18px #0006;flex-wrap:nowrap;gap:6px;padding:8px 12px}
header h1{white-space:nowrap;font-size:17px;letter-spacing:.2px;margin:0 0 0 6px;background:linear-gradient(90deg,#f3c964,#e0a526 60%,#b9801a);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1;gap:6px;padding:2px 0}nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;border-radius:999px;padding:6px 13px;background:#25262a;transition:.15s}
nav button.on{background:linear-gradient(135deg,#f0bd45,#d99a1c);box-shadow:0 2px 10px #e0a52655;font-weight:bold}
header .hbtn{padding:6px 10px;border-radius:999px;white-space:nowrap}
main{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card,.hcard,.chart{border-radius:14px;background:linear-gradient(180deg,#232427,#1d1e21);border-color:#33353a;box-shadow:0 2px 10px #0004}
.cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.card{position:relative;overflow:hidden;padding:12px 14px}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--ac,var(--brass))}
.card b{font-size:26px;color:var(--ac,var(--brass))}
.card i{position:absolute;left:10px;top:8px;font-style:normal;font-size:20px;opacity:.55}
button:active{transform:scale(.97)}
table{border-radius:14px}tr:nth-child(even) td{background:#ffffff05}
h2{border-right:3px solid var(--brass);padding-right:8px}
/* charts */
.chart{padding:12px 12px 8px}
.ch-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:4px}.ch-head b{font-size:15px}
.ch-stats{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--soft);font-size:12px}.ch-stats em{font-style:normal;color:var(--text)}
.ch-tip{min-height:22px;font-size:13px;color:var(--text);margin:2px 0 4px}
.cols{display:flex;gap:3px;align-items:flex-end;height:130px;direction:ltr;position:relative}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.col .v{font-size:10px;line-height:1.2;color:var(--soft);height:14px;white-space:nowrap}
.col .bar{width:100%;border-radius:5px 5px 2px 2px;background:var(--c);opacity:.6;min-height:2px;transition:opacity .15s}
.col.today .bar,.col.sel .bar{opacity:1}.col.today .v,.col.sel .v{color:var(--text);font-weight:bold}
.col.zero .bar{opacity:.25}
.axis{display:flex;gap:3px;direction:ltr;margin-top:3px}.axis span{flex:1;text-align:center;font-size:10px;color:var(--soft);min-width:0}
.avgline{position:absolute;left:0;right:0;border-top:1px dashed #ffffff55;pointer-events:none}
.avgline small{position:absolute;right:0;top:-14px;font-size:9px;color:#ffffffaa;background:#1d1e21cc;padding:0 3px}
@media(max-width:600px){main{padding:10px}.cols{height:120px}.col .v{font-size:9px}}

/* ---- look & feel v3: app font, readable numbers, all tabs visible ---- */
@font-face{font-family:Vazirmatn;font-weight:400;font-display:swap;src:url(/static/fonts/Vazirmatn-Regular.ttf)}
@font-face{font-family:Vazirmatn;font-weight:700;font-display:swap;src:url(/static/fonts/Vazirmatn-Bold.ttf)}
@font-face{font-family:Vazirmatn;font-weight:900;font-display:swap;src:url(/static/fonts/Vazirmatn-Black.ttf)}
body,button,input,select,textarea{font-family:Vazirmatn,Tahoma,system-ui,sans-serif}
body{font-size:14.5px;line-height:1.75;font-variant-numeric:tabular-nums}
.card b,.hcard .big,.ch-head b,td,th,.col .v{font-variant-numeric:tabular-nums}
.card b{font-size:32px;font-weight:900;line-height:1.3;display:block;letter-spacing:0}
.card span{font-size:13px;color:var(--soft)}
th{font-weight:700;white-space:nowrap}
.cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
h2{font-weight:900}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
.quick button{flex:1 1 140px;padding:11px 12px;border-radius:14px;font-weight:700;background:#25262a}
.quick button.hot{background:linear-gradient(135deg,#f0bd45,#d99a1c);color:#1a1a1a;border-color:transparent;font-weight:900}
@media(max-width:700px){
  header{flex-wrap:wrap}
  header h1{flex:1}
  nav{order:3;flex:1 0 100%;flex-wrap:wrap;overflow:visible;gap:6px}
  nav button{flex:1 1 calc(33.3% - 6px);padding:8px 6px;font-size:13px;text-align:center}
}
</style>
</head>
<body>
<div id="login">
  <h1>پنل مدیریت «پرونده»</h1>
  <p class="muted">کلید ادمین را وارد کن (فقط تا بستن این تب نگه داشته می‌شود).</p>
  <input id="key" type="password" autocomplete="off" placeholder="X-Admin-Key" class="ltr">
  <button id="enter">ورود</button>
  <p class="err" id="loginerr"></p>
</div>
<div id="app" hidden>
<header>
  <h1>پنل «پرونده»</h1>
  <nav id="nav"></nav>
  <span style="flex:1"></span>
  <button id="refresh" class="hbtn">⟳ تازه</button>
  <button id="logout" class="hbtn">خروج</button>
</header>
<main id="main"></main>
</div>
<dialog id="cdlg"><form method="dialog"><p id="cmsg" style="margin-top:0"></p><div class="row"><button id="cok" class="on">تأیید</button><button id="cno">انصراف</button></div></form></dialog>
<dialog id="dlg"><form method="dialog" id="dform"></form></dialog>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY = ''; try { KEY = sessionStorage.getItem('adminKey') || ''; } catch (e) {}
// The admin app opens /admin/ui#k=<key>: read it once and remove it from the address bar (a fragment is never sent to the server).
try { const m = /^#k=(.+)$/.exec(location.hash); if (m) { KEY = decodeURIComponent(m[1]).trim(); try { sessionStorage.setItem('adminKey', KEY); } catch (e) {} history.replaceState(null, '', location.pathname + location.search); } } catch (e) {}
const fmtT = t => t ? new Date(t * 1000).toLocaleString('fa-IR', {hour12: false}) : '—';
const ago = t => { if (!t) return '—'; const s = Date.now()/1000 - t; if (s < 90) return 'همین الان'; if (s < 5400) return Math.round(s/60) + ' دقیقه پیش'; if (s < 129600) return Math.round(s/3600) + ' ساعت پیش'; return Math.round(s/86400) + ' روز پیش'; };
const num = n => (n ?? 0).toLocaleString('fa-IR');
// The admin app's web view shows no browser pop-ups (the built-in question box answers "no" there), so questions are asked in the page itself.
function ask(msg) {
  return new Promise(res => {
    const d = $('#cdlg'); $('#cmsg').textContent = msg;
    const done = v => { try { d.close(); } catch (e) {} res(v); };
    $('#cok').onclick = e => { e.preventDefault(); done(true); };
    $('#cno').onclick = e => { e.preventDefault(); done(false); };
    d.oncancel = () => res(false);
    d.showModal();
  });
}
function note(msg) {
  const n = document.createElement('div'); n.textContent = msg;
  n.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;background:var(--brass);color:#1a1a1a;padding:8px 16px;border-radius:12px;font-weight:bold;max-width:90vw';
  document.body.appendChild(n); setTimeout(() => n.remove(), 3500);
}
async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {'X-Admin-Key': KEY, 'Content-Type': 'application/json', ...(opts.headers || {})}});
  if (r.status === 403) { logout(); throw new Error('کلید اشتباه است'); }
  if (!r.ok) throw new Error('خطا ' + r.status + ': ' + (await r.text()).slice(0, 200));
  return r.json();
}
const TABS = [['overview','📊 نمای کلی'],['feed','📡 فعالیت زنده'],['players','👥 بازیکن‌ها'],['cases','🗂 پرونده‌ها'],['comments','💬 نظرها'],['money','💰 پول و سکه'],['health','🩺 سلامت'],['actions','⚙ اقدام‌ها']];
// remember the open tab (per browser tab / app session) so a reload or a refresh never jumps elsewhere
let tab = 'overview', timer = null;
try { const t = sessionStorage.getItem('adminTab'); if (TABS.some(x => x[0] === t)) tab = t; } catch (e) {}
function buildNav() { try { sessionStorage.setItem('adminTab', tab); } catch (e) {} $('#nav').innerHTML = TABS.map(([k, n]) => `<button data-k="${k}" class="${k===tab?'on':''}">${n}</button>`).join(''); }
$('#nav').onclick = e => { const b = e.target.closest('button[data-k]'); if (b) { go(b.dataset.k); b.scrollIntoView({inline: 'center', block: 'nearest'}); } };
function go(k, arg) { tab = k; buildNav(); clearInterval(timer); timer = null; render(arg); }
async function render(arg) {
  const m = document.createElement('div'); $('#main').replaceChildren(m); // a fresh box per render: a late answer of an old tab writes into a detached box
  m.innerHTML = '<p class="muted">در حال بارگذاری…</p>';
  try { await VIEWS[tab](m, arg); } catch (e) { m.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; }
}
const compact = n => n >= 10000 ? (n/1000).toLocaleString('fa-IR', {maximumFractionDigits: 0}) + 'k' : n >= 1000 ? (n/1000).toLocaleString('fa-IR', {maximumFractionDigits: 1}) + 'k' : num(n);
const dayName = d => { try { return new Date(d + 'T12:00:00').toLocaleDateString('fa-IR', {weekday: 'long', month: 'long', day: 'numeric'}); } catch (e) { return d; } };
const dayNum = d => { try { return new Date(d + 'T12:00:00').toLocaleDateString('fa-IR', {day: 'numeric'}); } catch (e) { return d.slice(8); } };
let chartSeq = 0;
function chart(title, rows, key, color) {
  const id = 'c' + (++chartSeq), vals = rows.map(r => r[key]), max = Math.max(1, ...vals);
  const total = vals.reduce((a, v) => a + v, 0), avg = total / Math.max(1, vals.length), last = vals[vals.length - 1], prev = vals.length > 1 ? vals[vals.length - 2] : 0;
  const delta = last - prev, dtxt = delta === 0 ? 'بدون تغییر' : (delta > 0 ? '▲ ' : '▼ ') + num(Math.abs(delta));
  const H = 96, cols = rows.map((r, i) => `<div class="col${i === rows.length - 1 ? ' today' : ''}${vals[i] === 0 ? ' zero' : ''}" data-i="${i}" style="--c:${color}"><span class="v">${vals[i] ? compact(vals[i]) : '·'}</span><div class="bar" style="height:${Math.max(2, Math.round(H * vals[i] / max))}px"></div></div>`).join('');
  const avgTop = Math.round(H * avg / max);
  setTimeout(() => {
    const box = document.getElementById(id); if (!box) return; const tip = box.querySelector('.ch-tip');
    const show = i => { box.querySelectorAll('.col').forEach(c => c.classList.toggle('sel', +c.dataset.i === i)); tip.innerHTML = `<b>${esc(dayName(rows[i].day))}</b>: ${num(vals[i])}`; };
    box.querySelector('.cols').onclick = e => { const c = e.target.closest('.col'); if (c) show(+c.dataset.i); };
    show(rows.length - 1);
  }, 0);
  return `<div class="chart" id="${id}"><div class="ch-head"><b>${title}</b></div>
  <div class="ch-stats"><span>امروز: <em>${num(last)}</em> (${dtxt})</span><span>جمع: <em>${num(total)}</em></span><span>میانگین روزانه: <em>${num(Math.round(avg * 10) / 10)}</em></span><span>بیشترین: <em>${num(max === 1 && total === 0 ? 0 : max)}</em></span></div>
  <div class="ch-tip"></div>
  <div class="cols">${cols}${avg > 0 ? `<div class="avgline" style="bottom:${avgTop}px"><small>میانگین</small></div>` : ''}</div>
  <div class="axis">${rows.map(r => `<span>${dayNum(r.day)}</span>`).join('')}</div></div>`;
}
const card = (v, l, ic, ac) => `<div class="card" style="${ac ? '--ac:' + ac : ''}">${ic ? '<i>' + ic + '</i>' : ''}<b>${num(v)}</b><span>${l}</span></div>`;
const LV = {ok: 'سالم', warn: 'هشدار', bad: 'خطا'};
const dot = st => `<span class="st ${esc(st || 'warn')}" title="${esc(LV[st] || '')}"></span>`;
const dur = s => s == null ? '—' : s < 3600 ? Math.round(s/60) + ' دقیقه' : s < 172800 ? (s/3600).toFixed(1) + ' ساعت' : Math.round(s/86400) + ' روز';
const hk = (k, v) => `<tr><th>${k}</th><td>${v}</td></tr>`;
const yn = v => v ? 'بله' : 'خیر';
function liaraHtml(l) {
  let body;
  if (l.state === 'no_token') body = `<p>${esc(l.message)}</p><p class="muted">${esc(l.hint)}</p>`;
  else if (l.state === 'ok') body = `<b class="big">${num(l.balance)} <small>تومان</small></b><span class="muted">حد هشدار: ${num(l.limit)} تومان${l.cached ? ' · از حافظه (' + dur(l.age_s) + ' پیش)' : ''}${l.throttled ? ' · چند ثانیه صبر کن' : ''}</span>`;
  else body = `<p class="err">دریافت موجودی نشد: <span class="ltr">${esc(l.kind || 'error')}</span></p>`;
  return `<div class="hcard" id="lcard"><h3>${dot(l.status)} موجودی لیارا</h3>${body}<div class="row"><button id="lbtn">بررسی موجودی</button></div></div>`;
}
function healthHtml(h, lb) {
  const s = h.server || {}, d = h.domains || {}, c = h.content || {}, p = h.players || {}, x = h.security || {};
  const rows = s.rows ? Object.entries(s.rows).map(([k, v]) => `${esc(k)}: ${v == null ? '—' : num(v)}`).join(' · ') : '';
  const dom = (d.items || []).map(i => `<tr><td class="ltr">${esc(i.host)}</td><td>${dot(i.status)} ${i.days == null ? 'بررسی نشد (' + esc(i.error || '') + ')' : num(i.days) + ' روز تا پایان گواهی TLS'}</td></tr>`).join('');
  const vers = (p.app_versions || []).map(v => `<tr><td>${num(v.version)}</td><td>${num(v.players)}</td></tr>`).join('');
  const wn = c.weekend_next ? `${esc(c.weekend_next.id)} — ${fmtT(Date.parse(c.weekend_next.opens_at) / 1000)}` : 'هنوز نوشته نشده';
  return `<h2>${dot(h.overall)} وضعیت کلی: ${esc(LV[h.overall] || '')}</h2><div class="hgrid">
  <div class="hcard"><h3>${dot(s.status)} سرور</h3><table>${hk('نسخه', `<span class="ltr">${esc(s.version)}</span>`)}${hk('روشن‌بودن این پردازه', dur(s.uptime_s))}${hk('پردازه‌ها', s.workers == null ? 'نامشخص' : num(s.workers))}${hk('دیتابیس', s.db_ok ? 'در دسترس · ' + esc(s.db_ms) + ' میلی‌ثانیه' : 'در دسترس نیست')}${hk('حجم دیتابیس', s.db_size_mb == null ? '—' : esc(s.db_size_mb) + ' مگابایت')}${hk('ردیف‌ها', `<span class="ltr">${rows}</span>`)}</table></div>
  <div class="hcard"><h3>${dot(d.status)} آدرس‌ها</h3><table>${dom}</table></div>
  <div class="hcard"><h3>${dot(c.status)} محتوا</h3><table>${hk('پرونده‌ی شبانه‌ی آماده', `${dot(c.days_ahead_status)} ${num(c.days_ahead)} روز جلوتر (${num(c.nightly_total)} پرونده)`)}${hk('آخرین پرونده‌ی شبانه', c.last_nightly_opened ? fmtT(Date.parse(c.last_nightly_opened) / 1000) : '—')}${hk('پرونده‌ی آخر هفته‌ی بعدی', wn)}${hk('داستان', c.story ? `فصل ${num(c.story.season)} «${esc(c.story.title)}» · ${num(c.story.chapters)} قسمت نوشته‌شده · قسمت بعدی: ${num(c.story.next_missing)}` : '—')}${hk('اعتبارسنجی محتوا', c.validation === 'ok' ? 'سالم' : '<span class="err">ناموفق: ' + esc((c.problems || []).join('، ')) + '</span>')}</table></div>
  <div class="hcard"><h3>${dot(p.status)} بازیکن‌ها</h3><table>${hk('کل بازیکن‌ها', num(p.total))}${hk('فعال امروز', num(p.active_today))}${hk('حل‌شده امروز', num(p.solves_today))}${hk('خطای ۵xx در ساعت اخیر', p.errors_1h == null ? 'شمرده نمی‌شود' : num(p.errors_1h))}</table>${vers ? '<table><tr><th>نسخه‌ی برنامه</th><th>بازیکن</th></tr>' + vers + '</table>' : ''}</div>
  <div class="hcard"><h3>${dot(x.status)} امنیت و محدودیت‌ها</h3><table>${hk('ADMIN_API_KEY واقعی', yn(x.admin_key_real))}${hk('JWT_SECRET واقعی', yn(x.jwt_secret_real))}${hk('محدودکننده‌ی نرخ', x.rate_limit ? 'روشن' : 'خاموش')}${hk('مسدودشده در ساعت اخیر', x.rate_limit_blocked_1h == null ? 'شمرده نمی‌شود' : num(x.rate_limit_blocked_1h))}${hk('تبلیغات پاداشی', x.ads_enabled ? 'روشن' : 'خاموش')}${hk('BAZAAR_MODE', `<span class="ltr">${esc(x.bazaar_mode)}</span>`)}${hk('ENV', `<span class="ltr">${esc(x.env)}</span>`)}</table></div>
  ${liaraHtml(lb)}

function giftDialog(pid, name) {
  const f = $('#dform');
  f.innerHTML = `<h3 style="margin-top:0">${pid ? 'هدیه/پیام برای ' + esc(name || pid) : 'پیام برای همه‌ی بازیکن‌ها'}</h3><label>عنوان</label><input id="gt" maxlength="80"><label>متن</label><textarea id="gm" rows="3" maxlength="400"></textarea><label>سکه (۰ یعنی فقط پیام)</label><input id="gc" type="number" min="0" value="0"><label>اعتبار (روز، اختیاری)</label><input id="ge" type="number" min="0" value="0"><div class="row"><button value="send" id="gs">ارسال</button><button value="cancel" formnovalidate>لغو</button></div><p class="err" id="gerr"></p>`;
  $('#dlg').showModal();
  $('#gs').onclick = async ev => {
    ev.preventDefault();
    const title = $('#gt').value.trim(), coins = parseInt($('#gc').value || '0', 10), days = parseInt($('#ge').value || '0', 10);
    if (!title) { $('#gerr').textContent = 'عنوان لازم است'; return; }
    if (!(await ask((pid ? 'ارسال برای این بازیکن' : 'ارسال برای همه') + (coins ? ' با ' + coins + ' سکه' : '') + '؟'))) return;
    try {
      const body = {title, message: $('#gm').value.trim(), grants: coins > 0 ? [{type: 'coins', amount: coins}] : [], expires_in_days: days > 0 ? days : null};
      if (pid) body.player_id = pid;
      await api('/admin/gifts', {method: 'POST', body: JSON.stringify(body)}); $('#dlg').close(); note('ارسال شد'); if (tab === 'actions') render();
    } catch (e) { $('#gerr').textContent = e.message; }
  };
}
