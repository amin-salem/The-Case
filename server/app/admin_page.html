<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>پنل مدیریت پرونده</title>
<style>
:root{--bg:#131416;--bg2:#1b1c1f;--bg3:#25262a;--text:#efede8;--soft:#a3a099;--brass:#e0a526;--ok:#5dae7e;--bad:#e0604a;--line:#2b2c30;--r:16px}
*{box-sizing:border-box}
@font-face{font-family:Vazirmatn;font-weight:400;font-display:swap;src:url(/static/fonts/Vazirmatn-Regular.ttf)}
@font-face{font-family:Vazirmatn;font-weight:700;font-display:swap;src:url(/static/fonts/Vazirmatn-Bold.ttf)}
@font-face{font-family:Vazirmatn;font-weight:900;font-display:swap;src:url(/static/fonts/Vazirmatn-Black.ttf)}
body,button,input,select,textarea{font-family:Vazirmatn,Tahoma,system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--text);font-size:15.5px;line-height:1.85;font-variant-numeric:tabular-nums;padding-bottom:84px}
a{color:var(--brass)}
/* top bar: where you are, and two quiet actions */
header{display:flex;align-items:center;gap:10px;padding:14px 18px;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font-size:20px;font-weight:900}
.hbtn{padding:8px 14px;border-radius:12px;background:transparent;border:1px solid var(--line);color:var(--soft);font-size:14px}
button,input,select,textarea{color:var(--text);background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px}
button{cursor:pointer;min-height:44px}button:hover{border-color:var(--brass)}button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button.on,.row button.on{background:var(--brass);color:#1a1a1a;border-color:var(--brass);font-weight:700}
button.danger{border-color:var(--bad);color:var(--bad);background:transparent}
button[disabled]{opacity:.45;cursor:default}
main{padding:20px 18px;max-width:1100px;margin:auto}
h2{font-size:18px;font-weight:900;margin:30px 0 12px}
h3{font-size:16px;font-weight:700;margin:22px 0 8px}
main>div>h2:first-child{margin-top:4px}
.muted{color:var(--soft)}.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}.err{color:var(--bad)}
p{margin:8px 0}
/* numbers first */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:0 0 20px}
.card{background:var(--bg2);border-radius:var(--r);padding:16px 18px}
.card b{display:block;font-size:30px;font-weight:900;line-height:1.3;color:var(--text)}
.card span{display:block;color:var(--soft);font-size:14px;margin-top:2px}
.card small{display:block;margin-top:6px;font-size:13px}
.card i{display:none}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.hcard,.chart,.box{background:var(--bg2);border-radius:var(--r);padding:16px 18px;margin:0 0 14px}
.hcard h3{margin:0 0 8px;font-size:16px}.hcard .big{display:block;font-size:28px;font-weight:900}.hcard small{color:var(--soft)}
.hcard{overflow-x:auto}
/* tables: calm rows, no cell borders */
table{width:100%;border-collapse:collapse}
th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{color:var(--soft);font-weight:400;font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg2)}
.scroll{overflow-x:auto;background:var(--bg2);border-radius:var(--r);padding:4px 12px;margin:0 0 14px}
.hcard table,.hcard .scroll{background:none;padding:0}
td.num,th.num{white-space:nowrap}td.na{color:var(--soft)}
.tag{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;background:var(--bg3);color:var(--soft)}
.tag.solved,.tag.purchase{color:var(--ok)}.tag.failed,.tag.banned{color:var(--bad)}
.plink{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.row input[type=text],.row input:not([type]),.row input[type=search]{min-width:0}
label{display:inline-flex;gap:8px;align-items:center}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--brass)}
/* quick actions */
.quick{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
.quick button{flex:1 1 150px}
.quick button.hot{background:var(--brass);color:#1a1a1a;border-color:transparent;font-weight:900}
details.acwrap{margin:0 0 16px}
details.acwrap>summary,details.more>summary{cursor:pointer;padding:14px 18px;border-radius:var(--r);background:var(--bg2);list-style:none;min-height:44px}
details>summary::-webkit-details-marker{display:none}
details.more{margin:10px 0}
details.more[open]>summary{margin-bottom:12px}
/* charts */
.ch-head b{font-size:16px}
.ch-stats{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--soft);font-size:13px;margin-top:2px}.ch-stats em{font-style:normal;color:var(--text)}
.ch-tip{min-height:24px;font-size:14px;margin:6px 0}
.cols{display:flex;gap:4px;align-items:flex-end;height:130px;direction:ltr;position:relative}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.col .v{font-size:10px;line-height:1.2;color:var(--soft);height:14px;white-space:nowrap}
.col .bar{width:100%;border-radius:6px 6px 2px 2px;background:var(--c);opacity:.55;min-height:2px}
.col.today .bar,.col.sel .bar{opacity:1}.col.today .v,.col.sel .v{color:var(--text);font-weight:700}.col.zero .bar{opacity:.2}
.axis{display:flex;gap:4px;direction:ltr;margin-top:4px}.axis span{flex:1;text-align:center;font-size:10px;color:var(--soft);min-width:0}
.avgline{position:absolute;left:0;right:0;border-top:1px dashed #ffffff44;pointer-events:none}
.avgline small{position:absolute;right:0;top:-14px;font-size:9px;color:#ffffffaa;padding:0 3px}
/* status */
.st{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--soft);vertical-align:middle}.st.ok{background:var(--ok)}.st.warn{background:var(--brass)}.st.bad{background:var(--bad)}
.fbar{display:block;height:10px;min-width:60px;background:var(--bg3);border-radius:5px;overflow:hidden;direction:ltr}.fbar i{display:block;height:100%;background:var(--brass)}
.fbar.ok i{background:var(--ok)}.fbar.bad i{background:var(--bad)}
.spark{display:inline-flex;gap:1px;align-items:flex-end;height:22px;direction:ltr}.spark i{display:block;width:5px;background:var(--brass);opacity:.8;min-height:1px}
.ac{background:var(--bg2);border-right:5px solid var(--c,var(--soft));border-radius:var(--r);padding:14px 18px;margin:0 0 14px}
.ac.green{--c:var(--ok)}.ac.amber{--c:var(--brass)}.ac.red{--c:var(--bad)}
.ac h3{margin:0 0 4px;font-size:16px}.ac details{margin-top:8px}.ac summary{cursor:pointer;color:var(--soft)}
.ac .box{background:var(--bg3);margin-top:10px}
/* bottom tab bar + "more" sheet */
#tabbar{position:fixed;inset:auto 0 0 0;z-index:8;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#tabbar button{flex:1;min-width:0;background:none;border:0;border-radius:12px;color:var(--soft);font-size:13.5px;padding:10px 2px;min-height:48px}
#tabbar button.on{color:var(--brass);font-weight:900;background:var(--bg3)}
#more{position:fixed;inset:0;z-index:9;background:#000a;display:flex;align-items:flex-end}
#more[hidden]{display:none}
#more .sheet{width:100%;max-height:80vh;overflow:auto;background:var(--bg2);border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
#more .sheet button{display:block;width:100%;text-align:right;margin:0 0 8px;background:var(--bg3);border:0;padding:14px 16px}
#more .sheet button.on{background:var(--brass);color:#1a1a1a;font-weight:700}
/* dialogs, login, toast */
dialog{background:var(--bg2);color:var(--text);border:0;border-radius:20px;max-width:460px;width:92%;padding:22px}
dialog::backdrop{background:#000a}
dialog input,dialog textarea{width:100%;margin:4px 0 12px}
#login{max-width:340px;margin:18vh auto;text-align:center;padding:0 18px}
#login h1{font-size:22px}#login input{width:100%;margin:12px 0}
/* phone: a table becomes a list of small cards (labels come from the header row) */
@media(max-width:720px){
  main{padding:16px 14px}
  table.cz,table.cz tbody{display:block}
  table.cz tr:first-child{display:none}
  table.cz tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
  table.cz tr:last-child{border-bottom:0}
  table.cz td{display:flex;justify-content:space-between;gap:14px;border:0;padding:4px 2px;text-align:left}
  table.cz td::before{content:attr(data-l);color:var(--soft);font-size:13px;flex:none;text-align:right}
  table.cz td:first-child{font-weight:700;font-size:16px;justify-content:flex-start}
  table.cz td:first-child::before{display:none}
  .scroll{padding:2px 14px}
}
</style>
</head>
<body>
<div id="login">
  <h1>پنل مدیریت «پرونده»</h1>
  <p class="muted">کلید ادمین را وارد کن (فقط تا بستن این تب نگه داشته می‌شود).</p>
  <input id="key" type="password" autocomplete="off" placeholder="X-Admin-Key" class="ltr">
  <button id="enter">ورود</button>
  <p class="err" id="loginerr"></p>
</div>
<div id="app" hidden>
<header>
  <h1 id="ttl">نمای کلی</h1>
  <button id="refresh" class="hbtn">تازه‌سازی</button>
  <button id="logout" class="hbtn">خروج</button>
</header>
<main id="main"></main>
<nav id="tabbar" aria-label="بخش‌های پنل"></nav>
<div id="more" hidden><div class="sheet" id="moresheet"></div></div>
</div>
<dialog id="cdlg"><form method="dialog"><p id="cmsg" style="margin-top:0"></p><div class="row"><button id="cok" class="on">تأیید</button><button id="cno">انصراف</button></div></form></dialog>
<dialog id="dlg"><form method="dialog" id="dform"></form></dialog>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY = ''; try { KEY = sessionStorage.getItem('adminKey') || ''; } catch (e) {}
// The admin app opens /admin/ui#k=<key>: read it once and remove it from the address bar (a fragment is never sent to the server).
try { const m = /^#k=(.+)$/.exec(location.hash); if (m) { KEY = decodeURIComponent(m[1]).trim(); try { sessionStorage.setItem('adminKey', KEY); } catch (e) {} history.replaceState(null, '', location.pathname + location.search); } } catch (e) {}
const TZ = 'Asia/Tehran';   // every time in the panel is shown in Tehran time, whatever the phone's own zone is
const fmtT = t => t ? new Date(t * 1000).toLocaleString('fa-IR', {hour12: false, timeZone: TZ}) : '—';
// server strings: stored times are naive UTC ('...Z' added); game-clock times already carry +03:30 or are Tehran-local
const utcIso = iso => iso ? Date.parse(/[zZ]|[+-]\d\d:\d\d$/.test(iso) ? iso : iso + 'Z') / 1000 : null;
const tehIso = iso => iso ? Date.parse(/[zZ]|[+-]\d\d:\d\d$/.test(iso) ? iso : iso + '+03:30') / 1000 : null;
const ago = t => { if (!t) return '—'; const s = Date.now()/1000 - t; if (s < 90) return 'همین الان'; if (s < 5400) return Math.round(s/60) + ' دقیقه پیش'; if (s < 129600) return Math.round(s/3600) + ' ساعت پیش'; return Math.round(s/86400) + ' روز پیش'; };
const num = n => (n ?? 0).toLocaleString('fa-IR');
// The admin app's web view shows no browser pop-ups (the built-in question box answers "no" there), so questions are asked in the page itself.
function ask(msg) {
  return new Promise(res => {
    const d = $('#cdlg'); $('#cmsg').textContent = msg;
    const done = v => { try { d.close(); } catch (e) {} res(v); };
    $('#cok').onclick = e => { e.preventDefault(); done(true); };
    $('#cno').onclick = e => { e.preventDefault(); done(false); };
    d.oncancel = () => res(false);
    d.showModal();
  });
}
function note(msg) {
  const n = document.createElement('div'); n.textContent = msg;
  n.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;background:var(--brass);color:#1a1a1a;padding:8px 16px;border-radius:12px;font-weight:bold;max-width:90vw';
  document.body.appendChild(n); setTimeout(() => n.remove(), 3500);
}
async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {'X-Admin-Key': KEY, 'Content-Type': 'application/json', ...(opts.headers || {})}});
  if (r.status === 403) { logout(); throw new Error('کلید اشتباه است'); }
  if (!r.ok) throw new Error('خطا ' + r.status + ': ' + (await r.text()).slice(0, 200));
  return r.json();
}
const TABS = [['overview','نمای کلی'],['players','بازیکن‌ها'],['cases','پرونده‌ها'],['comments','نظرها'],['feed','فعالیت زنده'],['reviews','نظرات بازار'],['money','پول و سکه'],['funnel','قیف و ماندگاری'],['economy','اقتصاد سکه'],['health','سلامت'],['actions','اقدام‌ها']];
const PRIMARY = ['overview', 'players', 'cases', 'comments'];
// remember the open tab (per browser tab / app session) so a reload or a refresh never jumps elsewhere
let tab = 'overview', timer = null;
try { const t = sessionStorage.getItem('adminTab'); if (TABS.some(x => x[0] === t)) tab = t; } catch (e) {}
const moreOpen = () => !$('#more').hidden;
const closeMore = () => { $('#more').hidden = true; };
function buildNav() {
  try { sessionStorage.setItem('adminTab', tab); } catch (e) {}
  const title = (TABS.find(x => x[0] === tab) || [0, ''])[1]; $('#ttl').textContent = title; document.title = title + ' · پنل پرونده';
  const inMore = !PRIMARY.includes(tab);
  $('#tabbar').innerHTML = PRIMARY.map(k => `<button type="button" data-k="${k}" class="${k === tab ? 'on' : ''}"${k === tab ? ' aria-current="page"' : ''}>${TABS.find(x => x[0] === k)[1]}</button>`).join('') +
    `<button type="button" data-more="1" class="${inMore ? 'on' : ''}">بیشتر</button>`;
  $('#moresheet').innerHTML = TABS.filter(x => !PRIMARY.includes(x[0])).map(([k, n]) => `<button type="button" data-k="${k}" class="${k === tab ? 'on' : ''}">${n}</button>`).join('');
}
$('#tabbar').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.more) { $('#more').hidden = false; return; } if (b.dataset.k) go(b.dataset.k); };
$('#more').onclick = e => { if (e.target === $('#more')) { closeMore(); return; } const b = e.target.closest('button[data-k]'); if (b) go(b.dataset.k); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && moreOpen()) { e.preventDefault(); closeMore(); } });
function go(k, arg) { closeMore(); tab = k; buildNav(); clearInterval(timer); timer = null; window.scrollTo(0, 0); render(arg); }
async function render(arg) {
  const m = document.createElement('div'); $('#main').replaceChildren(m); // a fresh box per render: a late answer of an old tab writes into a detached box
  m.innerHTML = '<p class="muted">در حال بارگذاری…</p>';
  try { await VIEWS[tab](m, arg); } catch (e) { m.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; }
}
const compact = n => n >= 10000 ? (n/1000).toLocaleString('fa-IR', {maximumFractionDigits: 0}) + 'k' : n >= 1000 ? (n/1000).toLocaleString('fa-IR', {maximumFractionDigits: 1}) + 'k' : num(n);
const dayName = d => { try { return new Date(d + 'T12:00:00Z').toLocaleDateString('fa-IR', {weekday: 'long', month: 'long', day: 'numeric', timeZone: TZ}); } catch (e) { return d; } };
const dayNum = d => { try { return new Date(d + 'T12:00:00Z').toLocaleDateString('fa-IR', {day: 'numeric', timeZone: TZ}); } catch (e) { return d.slice(8); } };
let chartSeq = 0;
function chart(title, rows, key, color) {
  const id = 'c' + (++chartSeq), vals = rows.map(r => r[key]), max = Math.max(1, ...vals);
  const total = vals.reduce((a, v) => a + v, 0), avg = total / Math.max(1, vals.length), last = vals[vals.length - 1], prev = vals.length > 1 ? vals[vals.length - 2] : 0;
  const delta = last - prev, dtxt = delta === 0 ? 'بدون تغییر' : (delta > 0 ? '▲ ' : '▼ ') + num(Math.abs(delta));
  const H = 96, cols = rows.map((r, i) => `<div class="col${i === rows.length - 1 ? ' today' : ''}${vals[i] === 0 ? ' zero' : ''}" data-i="${i}" style="--c:${color}"><span class="v">${vals[i] ? compact(vals[i]) : '·'}</span><div class="bar" style="height:${Math.max(2, Math.round(H * vals[i] / max))}px"></div></div>`).join('');
  const avgTop = Math.round(H * avg / max);
  setTimeout(() => {
    const box = document.getElementById(id); if (!box) return; const tip = box.querySelector('.ch-tip');
    const show = i => { box.querySelectorAll('.col').forEach(c => c.classList.toggle('sel', +c.dataset.i === i)); tip.innerHTML = `<b>${esc(dayName(rows[i].day))}</b>: ${num(vals[i])}`; };
    box.querySelector('.cols').onclick = e => { const c = e.target.closest('.col'); if (c) show(+c.dataset.i); };
    show(rows.length - 1);
  }, 0);
  return `<div class="chart" id="${id}"><div class="ch-head"><b>${title}</b></div>
  <div class="ch-stats"><span>امروز: <em>${num(last)}</em> (${dtxt})</span><span>جمع: <em>${num(total)}</em></span><span>میانگین روزانه: <em>${num(Math.round(avg * 10) / 10)}</em></span><span>بیشترین: <em>${num(max === 1 && total === 0 ? 0 : max)}</em></span></div>
  <div class="ch-tip"></div>
  <div class="cols">${cols}${avg > 0 ? `<div class="avgline" style="bottom:${avgTop}px"><small>میانگین</small></div>` : ''}</div>
  <div class="axis">${rows.map(r => `<span>${dayNum(r.day)}</span>`).join('')}</div></div>`;
}
const card = (v, l) => `<div class="card"><b>${num(v)}</b><span>${l}</span></div>`;
const LV = {ok: 'سالم', warn: 'هشدار', bad: 'خطا'};
const dot = st => `<span class="st ${esc(st || 'warn')}" title="${esc(LV[st] || '')}"></span>`;
const dur = s => s == null ? '—' : s < 3600 ? Math.round(s/60) + ' دقیقه' : s < 172800 ? (s/3600).toFixed(1) + ' ساعت' : Math.round(s/86400) + ' روز';
const hk = (k, v) => `<tr><th>${k}</th><td>${v}</td></tr>`;
const yn = v => v ? 'بله' : 'خیر';
function liaraHtml(l) {
  let body;
  if (l.state === 'no_token') body = `<p>${esc(l.message)}</p><p class="muted">${esc(l.hint)}</p>`;
  else if (l.state === 'ok') body = `<b class="big">${num(l.balance)} <small>تومان</small></b><span class="muted">حد هشدار: ${num(l.limit)} تومان${l.cached ? ' · از حافظه (' + dur(l.age_s) + ' پیش)' : ''}${l.throttled ? ' · چند ثانیه صبر کن' : ''}</span>`;
  else body = `<p class="err">دریافت موجودی نشد: <span class="ltr">${esc(l.kind || 'error')}</span></p>`;
  return `<div class="hcard" id="lcard"><h3>${dot(l.status)} موجودی لیارا</h3>${body}<div class="row"><button id="lbtn">بررسی موجودی</button></div></div>`;
}
function healthHtml(h, lb) {
  const s = h.server || {}, d = h.domains || {}, c = h.content || {}, p = h.players || {}, x = h.security || {};
  const rows = s.rows ? Object.entries(s.rows).map(([k, v]) => `${esc(k)}: ${v == null ? '—' : num(v)}`).join(' · ') : '';
  const dom = (d.items || []).map(i => `<tr><td class="ltr">${esc(i.host)}</td><td>${dot(i.status)} ${i.days == null ? 'بررسی نشد (' + esc(i.error || '') + ')' : num(i.days) + ' روز تا پایان گواهی TLS'}</td></tr>`).join('');
  const vers = (p.app_versions || []).map(v => `<tr><td>${num(v.version)}</td><td>${num(v.players)}</td></tr>`).join('');
  const wn = c.weekend_next ? `${esc(c.weekend_next.id)} — ${fmtT(tehIso(c.weekend_next.opens_at))}` : 'هنوز نوشته نشده';
  return `<h2>${dot(h.overall)} وضعیت کلی: ${esc(LV[h.overall] || '')}</h2><div class="hgrid">

async function acRestoreRun(dry) {
  let after = 0, sum = {candidates: 0, stars: 0, ranked: 0, restored: 0, given: 0, by: {}};
  for (let i = 0; i < 400; i++) {   // 400 batches of 300 rows at most
    const r = await api('/admin/anticheat-restore', {method: 'POST', body: JSON.stringify({dry_run: dry, after, limit: 300})});
    sum.candidates += r.candidates; sum.stars += r.stars_to_give; sum.ranked += r.ranked_to_restore;
    sum.restored += r.restored || 0; sum.given += r.stars_given || 0;
    for (const [d, x] of Object.entries(r.by_difficulty)) { const b = sum.by[d] || (sum.by[d] = {solves: 0, stars: 0}); b.solves += x.solves; b.stars += x.stars; }
    after = r.next_after;
    if (r.done) return sum;
  }
  throw new Error('خیلی طول کشید؛ دوباره بزن (کار انجام‌شده سر جایش می‌ماند)');
}

const EMOJI = /\p{Extended_Pictographic}️?\s?/gu;
function tidy(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const todo = [];
  while (w.nextNode()) { const n = w.currentNode; if (EMOJI.test(n.nodeValue)) todo.push(n); EMOJI.lastIndex = 0; }
  todo.forEach(n => { n.nodeValue = n.nodeValue.replace(EMOJI, ''); });
  root.querySelectorAll('table').forEach(t => {
    if (t.classList.contains('cz') || t.classList.contains('kv')) return;
    const rows = t.rows; if (!rows.length) return;
    const head = [...rows[0].cells];
    if (!head.length || head.some(c => c.tagName !== 'TH')) { t.classList.add('kv'); return; }   // key/value tables stay tables
    const labels = head.map(c => c.textContent.trim());
    [...rows].slice(1).forEach(r => [...r.cells].forEach((c, i) => { if (labels[i]) c.setAttribute('data-l', labels[i]); }));
    t.classList.add('cz');
  });
}

      const body = {title, message: $('#gm').value.trim(), grants: coins > 0 ? [{type: 'coins', amount: coins}] : [], expires_in_days: days > 0 ? days : null};
      if (pid) body.player_id = pid;
      await api('/admin/gifts', {method: 'POST', body: JSON.stringify(body)}); $('#dlg').close(); note('ارسال شد'); if (tab === 'actions') render();
    } catch (e) { $('#gerr').textContent = e.message; }
  };
}
function logout() { try { sessionStorage.removeItem('adminKey'); } catch (e) {} KEY = ''; clearInterval(timer); $('#app').hidden = true; $('#login').hidden = false; }
async function enter() {
  KEY = $('#key').value.trim() || KEY;
  try { await api('/admin/api/health'); try { sessionStorage.setItem('adminKey', KEY); } catch (e) {} $('#login').hidden = true; $('#app').hidden = false; $('#loginerr').textContent = ''; buildNav(); render(); }
  catch (e) { $('#loginerr').textContent = e.message; }
}
$('#enter').onclick = enter; $('#key').onkeydown = e => { if (e.key === 'Enter') enter(); };
$('#refresh').onclick = () => render(); $('#logout').onclick = logout;
// pull down at the top of the page to refresh (touch screens, also in the admin app)
(() => { let y0 = null; const top = () => (window.scrollY || document.documentElement.scrollTop) <= 0;
  addEventListener('touchstart', e => { y0 = !moreOpen() && top() && e.touches.length === 1 ? e.touches[0].clientY : null; }, {passive: true});
  addEventListener('touchend', e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 120 && !$('#app').hidden && !$('#dlg').open && !moreOpen()) render(); y0 = null; }, {passive: true}); })();
if (KEY) enter();
</script>
</body>
