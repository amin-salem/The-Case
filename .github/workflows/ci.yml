name: CI

on:
  push:
  pull_request:

jobs:
  admin-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --prefix /tmp/admin-menu-ui playwright@1.56.1
          /tmp/admin-menu-ui/node_modules/.bin/playwright install --with-deps chromium
      - name: Mobile admin navigation (synthetic data only)
        env:
          NODE_PATH: /tmp/admin-menu-ui/node_modules
        run: node server/tools/test_admin_menu.cjs

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: server
        run: pip install -r requirements-dev.txt
      - name: Tests (all 50 cases are played through the API)
        working-directory: server
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee ../pytest.log
      - name: Report pytest failure
        if: failure()
        run: echo "::error title=pytest::$(tail -c 6000 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
      - name: Database migrations (fresh database, and an old one without the new columns)
        working-directory: server
        env:
          DATABASE_URL: sqlite+aiosqlite:///./mig.db
        run: |
          set -e
          alembic upgrade head
          python - <<'EOF2'
          import sqlite3
          d = sqlite3.connect("mig.db")
          names = {r[1] for r in d.execute("PRAGMA index_list(case_progress)")}
          assert {"ix_progress_case_solved", "ix_progress_rank"} <= names, names
          pnames = {r[1] for r in d.execute("PRAGMA index_list(players)")}
          assert {"ix_players_referred_by", "ix_players_created_at", "ix_players_last_seen"} <= pnames, pnames
          assert {"ix_progress_opened_at", "ix_progress_finished_at"} <= names, names
          print("capacity indexes ok")
          EOF2
          rm -f mig.db
          cat > /tmp/mig_lists.py <<'EOF'
          # columns and tables added by migrations after 0001 (an old database misses them)
          COLUMNS = [("players", "login_day"), ("players", "streak_freezes"),
                     ("case_progress", "first_accused"), ("case_progress", "proof_misses"),
                     ("players", "last_chest_day"), ("players", "chest_streak"), ("players", "chests"),
                     ("case_progress", "seen"), ("players", "xp"),
                     ("players", "stats"), ("case_progress", "active_seconds"), ("case_progress", "last_tick_at"),
                     ("players", "warrants"),
                     ("players", "referral_paid"), ("case_progress", "ranked"), ("case_progress", "reveal_at"),
                     ("players", "client_version"), ("players", "client_build"), ("players", "platform"),
                     ("players", "os_version"), ("players", "device_model"), ("players", "client_at"),
                     ("players", "phone_last4"), ("players", "phone_verified_at"), ("players", "feed_seen_at"), ("case_progress", "wrong_tries"), ("case_progress", "shows"),
                     ("players", "avatar_id"), ("players", "avatar_frame"), ("players", "tester"),
                     ("case_progress", "night1")]
          TABLES = ["riddle_answers", "mission_days", "player_achievements", "story_progress", "story_state", "admin_log", "rate_hits", "case_comments", "referral_payouts", "phone_codes", "player_avatars", "week_leagues", "week_settlements"]
          EOF
          python - <<'EOF'
          import sqlite3, sys
          sys.path.insert(0, "/tmp")
          from mig_lists import COLUMNS, TABLES
          from sqlalchemy import create_engine
          from app import models  # noqa: F401
          from app.db import Base
          Base.metadata.create_all(create_engine("sqlite:///mig.db"))
          db = sqlite3.connect("mig.db")
          for t, c in COLUMNS:
              db.execute(f"ALTER TABLE {t} DROP COLUMN {c}")
          for t in TABLES:
              db.execute(f"DROP TABLE {t}")
          db.commit()
          EOF
          alembic stamp 0001
          alembic upgrade head
          python - <<'EOF'
          import sqlite3, sys
          sys.path.insert(0, "/tmp")
          from mig_lists import COLUMNS, TABLES
          d = sqlite3.connect("mig.db")
          tables = {r[0] for r in d.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert set(TABLES) <= tables, tables
          for t, c in COLUMNS:
              assert c in {r[1] for r in d.execute(f"PRAGMA table_info({t})")}, (t, c)
          print("migration ok")
          EOF
      - name: Start the server and run the smoke test against it
        working-directory: server
        run: |
          uvicorn app.main:app --port 8765 &
          sleep 5
          python tools/smoke_test.py http://127.0.0.1:8765 --solve
      - name: Load test, sanity only (30 virtual players against a local server, rate limits off)
        working-directory: server
        env:
          RATE_LIMIT: "false"
          DATABASE_URL: sqlite+aiosqlite:///./load.db
        run: |
          uvicorn app.main:app --port 8766 &
          sleep 5
          python tools/load_test.py http://127.0.0.1:8766 -n 30 --ramp 5 --think 0.1 --concurrency 6

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze and test
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ../flutter.log
          flutter analyze 2>&1 | tee -a ../flutter.log
          flutter test 2>&1 | tee -a ../flutter.log
      - name: Report Flutter failure
        if: failure()
        run: echo "::error title=flutter::$(tail -c 6000 flutter.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"


  wallet-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wallet_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet_ci -d wallet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: server
        run: pip install -r requirements-dev.txt
      - name: PostgreSQL wallet and claim concurrency (isolated database)
        working-directory: server
        env:
          WALLET_TEST_DATABASE_URL: postgresql+asyncpg://wallet_ci:isolated-ci-only@localhost:5432/wallet_test
        run: pytest -q tests/test_wallet_concurrency.py

