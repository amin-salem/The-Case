name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: server
        run: pip install -r requirements-dev.txt
      - name: Tests (all 50 cases are played through the API)
        working-directory: server
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee ../pytest.log
      - name: Report pytest failure
        if: failure()
        run: echo "::error title=pytest::$(tail -c 6000 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
      - name: Database migrations (fresh database, and an old one without the new columns)
        working-directory: server
        env:
          DATABASE_URL: sqlite+aiosqlite:///./mig.db
        run: |
          set -e
          alembic upgrade head
          rm -f mig.db
          cat > /tmp/mig_lists.py <<'EOF'
          # columns and tables added by migrations after 0001 (an old database misses them)
          COLUMNS = [("players", "login_day"), ("players", "streak_freezes"),
                     ("case_progress", "first_accused"), ("case_progress", "proof_misses")]
          TABLES = ["riddle_answers"]
          EOF
          python - <<'EOF'
          import sqlite3, sys
          sys.path.insert(0, "/tmp")
          from mig_lists import COLUMNS, TABLES
          from sqlalchemy import create_engine
          from app import models  # noqa: F401
          from app.db import Base
          Base.metadata.create_all(create_engine("sqlite:///mig.db"))
          db = sqlite3.connect("mig.db")
          for t, c in COLUMNS:
              db.execute(f"ALTER TABLE {t} DROP COLUMN {c}")
          for t in TABLES:
              db.execute(f"DROP TABLE {t}")
          db.commit()
          EOF
          alembic stamp 0001
          alembic upgrade head
          python - <<'EOF'
          import sqlite3, sys
          sys.path.insert(0, "/tmp")
          from mig_lists import COLUMNS, TABLES
          d = sqlite3.connect("mig.db")
          tables = {r[0] for r in d.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert set(TABLES) <= tables, tables
          for t, c in COLUMNS:
              assert c in {r[1] for r in d.execute(f"PRAGMA table_info({t})")}, (t, c)
          print("migration ok")
          EOF
      - name: Start the server and run the smoke test against it
        working-directory: server
        run: |
          uvicorn app.main:app --port 8765 &
          sleep 5
          python tools/smoke_test.py http://127.0.0.1:8765 --solve

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze and test
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ../flutter.log
          flutter analyze 2>&1 | tee -a ../flutter.log
          flutter test 2>&1 | tee -a ../flutter.log
      - name: Report Flutter failure
        if: failure()
        run: echo "::error title=flutter::$(tail -c 6000 flutter.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
