name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: server
        run: pip install -r requirements-dev.txt
      - name: Tests (all 50 cases are played through the API)
        working-directory: server
        run: pytest -q
      - name: Start the server and run the smoke test against it
        working-directory: server
        run: |
          uvicorn app.main:app --port 8765 &
          sleep 5
          python tools/smoke_test.py http://127.0.0.1:8765 --solve

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
