name: Probe
on:
  push:
    branches: [domain-gaamly]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: gaamly.ir health
        run: |
          for host in gaamly.ir thecase.liara.run; do
            echo "== $host"
            getent hosts $host || echo "no DNS"
            curl -sS -m 25 -i https://$host/health 2>&1 | head -12 || true
          done
          echo "== cert"
          echo | openssl s_client -servername gaamly.ir -connect gaamly.ir:443 2>/dev/null | openssl x509 -noout -subject -enddate 2>&1 || echo "no cert"
          curl -s -m 25 https://gaamly.ir/health | grep -q '"ok":true'
