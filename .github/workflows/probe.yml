name: Probe
on:
  push:
    branches: [domain-gaamly]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: gaamly.ir health
        run: |
          for host in gaamly.ir thecase.liara.run; do
            dns=$(getent hosts $host | head -1 | tr -s ' ' | tr -d '\n' || true)
            code=$(curl -s -m 25 -o /tmp/b -w '%{http_code}' https://$host/health || true)
            body=$(head -c 120 /tmp/b 2>/dev/null | tr -d '\n' || true)
            echo "::notice title=$host::dns=[$dns] http=$code body=$body"
          done
          cert=$(echo | openssl s_client -servername gaamly.ir -connect gaamly.ir:443 2>/dev/null | openssl x509 -noout -subject -enddate 2>&1 | tr '\n' ' ')
          echo "::notice title=cert::$cert"
          curl -s -m 25 https://gaamly.ir/health | grep -q '"ok":true'
