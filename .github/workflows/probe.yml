name: Probe
on:
  push:
    branches: [domain-gammly]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: code
        run: |
          code=$(curl -s -m 25 -o /tmp/b -w '%{http_code}' https://thecase.liara.run/health || true)
          echo "code=$code"
          [ "$code" = 200 ] && exit 0
          [ "$code" = 503 ] && exit 3
          [ "$code" = 502 ] && exit 4
          [ "$code" = 404 ] && exit 5
          [ "$code" = 000 ] && exit 6
          exit 7
      - name: whois
        if: always()
        run: |
          getent hosts thecase.liara.run
          dig +short NS gammly.ir || true
          dig +short A gammly.ir @8.8.8.8 || true
          dig +short SOA gammly.ir @8.8.8.8 || true
          exit 9
