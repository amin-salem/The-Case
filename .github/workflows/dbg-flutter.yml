name: dbg-flutter
on:
  push:
    branches: [app/sheet-archive-20261116]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
      - name: Run the two new test files
        working-directory: app
        run: |
          flutter pub get >/dev/null 2>&1
          flutter test test/suspect_sheet_test.dart test/archive_filter_sheet_test.dart --reporter expanded > ../t.log 2>&1 || echo FAILED >> ../t.log
          grep -n "EXCEPTION\|Expected\|Actual\|Which is\|\[E\]\|FAILED\|Failed\|overflow\|The following" -A6 ../t.log | head -c 5500 > ../short.log || true
      - name: Show
        run: echo "::error title=dbg::$(cat short.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
