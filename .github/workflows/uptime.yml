name: Server watch
# Every 30 minutes: is the game server answering? If not, this run fails and GitHub sends
# the repo owner an email / GitHub-app notification ("Server watch failed").
# The Liara wallet is watched by its own daily workflow: liara-balance.yml.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Server answers
        run: |
          ok=0
          for url in https://gaamly.ir; do
            body=$(curl -sS -m 25 "$url/health" 2>&1 || true)
            echo "$url → $body"
            if echo "$body" | grep -q '"ok":true'; then ok=1; echo "::notice title=$url::$body"; fi
          done
          if [ "$ok" != 1 ]; then
            echo "::error title=Server down::gaamly.ir did not answer /health. Check the Liara panel (app stopped? wallet empty?)."
            exit 1
          fi
