name: Release APK

# Run it from the Actions tab, push a tag like v1.1.0, or push to the "release" branch.
# Every run publishes a GitHub release named after the app version in pubspec.yaml,
# with the APK and the live server check attached.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [release]

permissions:
  contents: write

jobs:
  live-server:
    # Checks the real server on Liara answers every call the app makes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Smoke test against https://thecase.liara.run
        working-directory: server
        run: |
          pip install httpx==0.28.1
          curl -sS -m 25 https://thecase.liara.run/health; echo
          python tools/smoke_test.py https://thecase.liara.run

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Server tests
        working-directory: server
        run: |
          pip install -r requirements-dev.txt
          pytest -q
      - name: Android project (created once, it is not kept in git)
        working-directory: app
        run: flutter create --org ir.aminsalem --project-name the_case --platforms android .
      - name: Signing key (optional; without it the APK is signed with the debug key)
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" > android/key.properties
          fi
      - name: Build
        working-directory: app
        run: |
          flutter analyze
          flutter test
          ./tools/build_release.sh
      - name: Live server check (the result goes into the release notes)
        continue-on-error: true
        run: |
          cd server
          {
            echo "## Live server check: https://thecase.liara.run"
            echo '```'
            curl -sS -m 25 https://thecase.liara.run/health || echo "(health failed)"
            echo
            python tools/smoke_test.py https://thecase.liara.run 2>&1 && echo "RESULT: ALL OK" || echo "RESULT: FAILED"
            echo '```'
          } | tee ../app/release/server_check.md
      - name: Release notes
        id: meta
        run: |
          V=$(grep '^version:' app/pubspec.yaml | awk '{print $2}')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v${V%%+*}-build${V##*+}" >> "$GITHUB_OUTPUT"
          {
            echo "App $V, commit ${GITHUB_SHA::7}."
            echo
            echo "APK files:"
            (cd app/release && sha256sum *.apk && ls -l *.apk)
            echo
            cat app/release/server_check.md 2>/dev/null || true
          } > notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: the_case-apk
          path: app/release/*
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.meta.outputs.tag }}
          name: پرونده ${{ steps.meta.outputs.version }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          files: |
            app/release/*.apk
            app/release/server_check.md
