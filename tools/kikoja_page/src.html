<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>کی کجا؟</title>
<style>
/*__FONTS__*/
:root{--night:#17181A;--night2:#202124;--night3:#2B2D31;--line:#34363B;--text:#E6E2DA;--soft:#9A9890;--brass:#E0A526;--stamp:#D0543F;--kraft:#C9A15E;--paper:#E9E4D8;--ink:#222326;--inksoft:#615F5A;--ok:#5DAE7E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--text);font-family:KV,Tahoma,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
#app{height:100%;display:flex;flex-direction:column;position:relative}
.scr{height:100%;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px 6px;flex:none}
.rbtn{width:44px;height:44px;flex:none;border-radius:50%;background:var(--night2);display:flex;align-items:center;justify-content:center}
.rbtn:active{background:var(--night3)}
.grow{flex:1;min-width:0}
.ttl{font-weight:900;font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;color:var(--soft)}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--brass);display:block}.dots i.off{background:var(--night3)}
.lvl{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:900;color:var(--brass)}
.lvl b{display:flex;align-items:center;gap:3px}.lvl b i{width:16px;height:6px;border-radius:3px;display:block}
/* plan */
.plan{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#111214;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.plan svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.plan .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.38) 100%)}
.rc{position:absolute}
.rc .lab{position:absolute;top:4%;right:4%;font-size:10.5px;font-weight:700;line-height:1.5;color:var(--text);background:rgba(17,18,20,.72);border-radius:6px;padding:0 5px}
.rc .glow{position:absolute;inset:0;background:radial-gradient(circle at 68% 30%,rgba(224,165,38,.42),rgba(224,165,38,.08) 45%,transparent 70%)}
.rc .hl{position:absolute;inset:2%;border-radius:6px}
.rc .faces{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:center;gap:4px}
.face{position:relative;width:27px;height:27px;flex:none}
.face img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.face.out img{filter:grayscale(1);opacity:.55}
.face .no{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.face b{position:absolute;top:-5px;left:-5px;width:15px;height:15px;border-radius:50%;color:#17181A;font-size:9.5px;font-weight:900;display:flex;align-items:center;justify-content:center}
.lock{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#111214;border:1.5px solid var(--stamp);display:flex;align-items:center;justify-content:center;opacity:.55}
.lock.on{opacity:1;box-shadow:0 0 12px rgba(208,84,63,.7)}
/* chips */
.chips{display:grid;gap:6px}
.chip{height:46px;border-radius:12px;background:#26272B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:13.5px;font-variant-numeric:tabular-nums;position:relative}
.chip.sel{background:var(--brass);color:#17181A}
.chip.hint{box-shadow:inset 0 0 0 2px var(--brass),0 0 14px rgba(224,165,38,.45)}
.chip .pd{display:flex;gap:3px;height:6px}.chip .pd i{width:6px;height:6px;border-radius:50%;display:block}
/* tray + list */
.tray{display:flex;flex-direction:column;gap:6px;padding:8px 12px 2px;flex:none}
.pin{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:14px;background:var(--paper);color:var(--ink)}
.pin .w{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:900;color:var(--inksoft)}
.pin .w img{width:18px;height:18px;border-radius:50%;object-fit:cover}
.pin .tx{font-size:13.5px;line-height:1.65;font-weight:500}
.nb{width:24px;height:24px;flex:none;border-radius:50%;color:#17181A;font-weight:900;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.empty{height:46px;border-radius:14px;border:1.5px dashed #3A3C41;display:flex;align-items:center;justify-content:center;gap:8px;color:#7C7A73;font-size:12.5px}
.list{flex:1;min-height:0;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:14px}
.list::-webkit-scrollbar{width:0}
.grp{display:flex;flex-direction:column;gap:6px}
.gh{display:flex;align-items:center;gap:8px;padding:0 4px}
.gh img,.gh .doc{width:28px;height:28px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1.5px #3A3C41}
.gh .doc{background:#3A3220;display:flex;align-items:center;justify-content:center;box-shadow:none}
.gh.pair img{box-shadow:0 0 0 2px var(--brass)}
.gh b{font-weight:900;font-size:13.5px}.gh small{font-size:11.5px;color:var(--soft)}
.st{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;background:#1F2023;text-align:right}
.st .t{flex:1;min-width:0;font-size:13.5px;line-height:1.75;color:#C9C4B8}
.st.on{background:var(--night3)}
.st.line{background:transparent;padding:4px 12px;cursor:default}
.k-t{color:var(--brass);font-weight:900;font-variant-numeric:tabular-nums}
.k-r{color:#E9E4D8;font-weight:700;border-bottom:1.5px dotted #8A6A2E}
.k-p{color:var(--text);font-weight:900}
.paper .k-t{color:#8A6A2E}.paper .k-r{color:var(--ink);border-bottom-color:#8A6A2E}.paper .k-p{color:var(--ink)}
.foot{padding:10px 14px 16px;background:linear-gradient(to top,var(--night) 70%,rgba(23,24,26,0));flex:none;display:flex;gap:10px}
.btn{height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:16.5px;flex:1;width:100%}
.btn.red{background:var(--stamp);color:#FFF6EE;box-shadow:0 10px 24px rgba(208,84,63,.32)}
.btn.gold{background:var(--brass);color:#17181A}
.btn.ghost{background:var(--night2);color:var(--text);font-weight:700;font-size:14.5px;height:50px}
.btn[disabled]{opacity:.38;pointer-events:none}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 50% 46%,var(--cf,var(--brass)) 0 48%,var(--cg,#9C7420) 48% 62%,var(--cf,var(--brass)) 62% 92%,transparent 92%),var(--cg,#9C7420);display:inline-block;flex:none}.coin.dk{--cf:#9C7420;--cg:#17181A}
.pill{display:flex;align-items:center;gap:5px;background:rgba(23,24,26,.14);border-radius:999px;padding:4px 11px}
/* intro */
.intro{flex:1;min-height:0;overflow-y:auto;padding:6px 20px 8px;display:flex;flex-direction:column;align-items:center;gap:12px}
.intro::-webkit-scrollbar{width:0}
.paper{background:var(--paper);color:var(--ink);border-radius:16px;padding:14px 18px;font-size:14.5px;line-height:1.9;font-weight:500;text-align:center;width:100%}
.cast{display:grid;gap:12px 8px;width:100%}
.cm{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cm img{width:62px;height:62px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--night3),0 6px 16px rgba(0,0,0,.5)}
.cm b{font-size:13px;font-weight:900}.cm small{font-size:11px;color:var(--soft);margin-top:-3px;text-align:center}
.legend{display:flex;justify-content:center;gap:22px;color:var(--soft);font-size:12.5px;padding:2px 24px 12px;flex:none}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:8px;height:8px;border-radius:50%;display:block}
/* accuse */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:10px 16px 4px;flex:none}
.steps div{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:#5B5C60;font-weight:700}
.steps i{height:5px;border-radius:3px;background:var(--night3);display:block}
.steps .done i{background:var(--brass)}.steps .done{color:var(--soft)}
.steps .cur i{background:var(--brass);box-shadow:0 0 10px rgba(224,165,38,.7)}.steps .cur{color:var(--brass);font-weight:900}
.acc.paper{width:auto}.acc{margin:12px 16px 0;min-width:0;overflow:hidden;border-radius:20px;background:var(--paper);color:var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:none}
.acc .who{min-width:0;display:flex;align-items:center;gap:10px}
.acc .who img{width:48px;height:48px;border-radius:50%;object-fit:cover;filter:grayscale(.35) sepia(.25)}
.acc .stamp{margin-right:auto;margin-left:6px;flex:none;transform:rotate(-8deg);border:2px solid var(--stamp);color:var(--stamp);border-radius:8px;padding:1px 10px;font-weight:900;font-size:14px}
.acc .lie{display:flex;gap:10px;align-items:flex-start;border-top:1px dashed #BDB5A3;padding-top:10px;font-size:14px;line-height:1.75;font-weight:500}
.q{padding:16px 20px 6px;font-weight:900;font-size:18px;flex:none}
.opts{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 8px;display:flex;flex-direction:column;gap:8px}
.opts::-webkit-scrollbar{width:0}
.op{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;background:var(--night2);text-align:right}
.op.on{background:#2A261C;box-shadow:inset 0 0 0 2px var(--brass)}
.op.pair{box-shadow:inset 0 0 0 1.5px rgba(224,165,38,.5)}
.rad{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid #5B5C60;display:flex;align-items:center;justify-content:center}
.op.on .rad{border-color:var(--brass)}.op.on .rad i{width:10px;height:10px;border-radius:50%;background:var(--brass);display:block}
.chk{border-radius:7px}.op.on .chk i{border-radius:3px}
.op .sp{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:900;color:var(--soft)}
.op .sp img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.op .tx{font-size:13.5px;line-height:1.7;color:#D8D3C8}
.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.big .op{flex-direction:column;gap:6px;padding:14px 10px;text-align:center;justify-content:center}
.big img{width:72px;height:72px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--night3)}
.big .op.on img{box-shadow:0 0 0 3px var(--brass)}
/* result */
.res{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:8px 20px 8px;gap:14px;position:relative}
.res::-webkit-scrollbar{width:0}
.halo{position:absolute;inset:0 0 auto 0;height:440px;background:radial-gradient(300px 250px at 50% 34%,rgba(224,165,38,.22),transparent 70%);pointer-events:none}
.seal{position:relative;width:148px;height:148px;border-radius:50%;border:3px solid var(--stamp);display:flex;align-items:center;justify-content:center;transform:rotate(-10deg);box-shadow:inset 0 0 0 6px var(--night),inset 0 0 0 8px rgba(208,84,63,.55);margin-top:14px;flex:none}
.seal span{font-weight:900;font-size:32px;color:var(--stamp)}
.shields{display:flex;gap:10px;align-items:flex-end;position:relative}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;position:relative}
.stat{border-radius:18px;background:var(--night2);padding:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stat b{font-weight:900;font-size:28px;font-variant-numeric:tabular-nums}
.proof{width:100%;border-radius:18px;background:var(--paper);color:var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.7;position:relative}
.proof .r{display:flex;gap:8px;align-items:flex-start}.proof img{width:28px;height:28px;flex:none;border-radius:50%;object-fit:cover}
.proof hr{border:0;height:1px;background:#CFC7B5;margin:0;width:100%}
.next{font-size:12.5px;color:var(--soft);text-align:center;padding-top:2px}
/* sheet + toast */
.ov{position:absolute;inset:0;background:rgba(8,8,10,.66);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--night2);border-radius:28px 28px 0 0;padding:10px 20px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -20px 50px rgba(0,0,0,.5)}
.grab{width:40px;height:4px;border-radius:2px;background:#45464A;align-self:center}
.hc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--night);width:100%}
.hc .ic{width:40px;height:40px;border-radius:50%;background:#2E281B;display:flex;align-items:center;justify-content:center;flex:none}
.toast{position:absolute;left:16px;right:16px;bottom:90px;z-index:30;background:#0F1012;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px 14px;font-size:13.5px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.spin{height:100%;display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:14px}
</style>
</head>
<body>
<div id="app"><div class="spin">…</div></div>
<script>
'use strict';
const IMG = /*__IMG__*/;
const PLANS = /*__PLANS__*/;
const NAMES = {mina:'مینا',nasrin:'نسرین',taraneh:'ترانه',kaveh:'کاوه',bahram:'بهرام',mansour:'منصور',farhad:'فرهاد',reza:'رضا'};
const HOUSES = {
  qolhak:{name:'خانهٔ باغِ قلهک',h:212,rooms:{lib:['کتابخونه','کتابخانه',2,0],salon:['سالن','سالن',1,0],yard:['حیاط','حیاط',0,0],study:['اتاق کار','اتاق کار',2,1],hall:['راهرو','راهرو',1,1],kitchen:['آشپزخونه','آشپزخانه',0,1]}},
  kashan:{name:'خانهٔ تاریخیِ کاشان',h:312,rooms:{upper:['بالاخونه','بالاخانه',2,0],porch:['ایوون','ایوان',1,0],shah:['شاه‌نشین','شاه‌نشین',0,0],kitchen:['مطبخ','مطبخ',2,1],court:['حیاط','حیاط و حوض',1,1],lib:['کتابخونه','کتابخانه',0,1],store:['انبار','انبار',2,2],hashti:['هشتی','هشتی',1,2],guest:['اتاق مهمون','اتاق مهمان',0,2]}}
};
const ACT = {
  lib:['دنبالِ یه کتاب می‌گشتم','روزنامه می‌خوندم'],salon:['پای تلویزیون نشسته بودم','داشتم با بقیه حرف می‌زدم'],
  yard:['رفته بودم هوا بخورم','داشتم با تلفن حرف می‌زدم'],study:['داشتم یه نامه رو امضا می‌کردم','دنبالِ شارژرِ گوشیم بودم'],
  hall:['داشتم کتم رو از جالباسی برمی‌داشتم','منتظرِ تاکسی بودم'],kitchen:['داشتم چای دم می‌کردم','یه لیوان آب خوردم'],
  upper:['داشتم چمدونم رو می‌بستم','از پنجره بیرون رو نگاه می‌کردم'],porch:['روی پله‌ها نشسته بودم','داشتم عکس می‌گرفتم'],
  shah:['داشتم گچ‌بری‌ها رو نگاه می‌کردم','شمع‌ها رو روشن می‌کردم'],court:['کنارِ حوض نشسته بودم','داشتم گلدون‌ها رو آب می‌دادم'],
  store:['دنبالِ فانوس می‌گشتم','داشتم صندلی‌ها رو جابه‌جا می‌کردم'],hashti:['داشتم در رو قفل می‌کردم','منتظرِ کسی بودم'],
  guest:['داشتم لباس عوض می‌کردم','کمی دراز کشیده بودم']
};
const LEVEL_FA = {easy:'آسان',medium:'متوسط',hard:'سخت'};
const COLORS = ['#E0A526','#7FB8D8','#E07A5F'];
const STEP_FA = ['دزد','دروغ','تناقض','شاهد'];
const WRONG_FA = {who:'این مظنون دزد نیست.',lie:'این حرفش دروغ نبود.',con:'این صحبت دروغش رو رد نمی‌کنه.',wit:'شاهد کافی نیست؛ حرفی رو انتخاب کن که گوینده‌ی «ردکننده» رو تبرئه کنه.'};
const ERR_FA = {not_enough_coins:'سکه‌ات کافی نیست.',locked:'این معما هنوز باز نشده.',failed:'این پرونده بسته شده.',already_solved:'این معما قبلاً حل شده.',closed:'این پرونده بسته شده.',no_kikoja:'فعلاً در دسترس نیست.',error:'یه مشکلی پیش اومد؛ دوباره امتحان کن.'};
const fa = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $app = document.getElementById('app');

/* ---------------- bridge ---------------- */
const KKB = (() => {
  let n = 0; const wait = {};
  window.__kkReply = (id, r) => { const w = wait[id]; if (!w) return; delete wait[id]; r && r.ok ? w.ok(r.data) : w.no(r && r.error || 'error'); };
  const hasApp = () => typeof window.KK !== 'undefined' && window.KK && typeof window.KK.postMessage === 'function';
  return { call(op, body) { return new Promise((ok, no) => { if (!hasApp()) { no('error'); return; } const id = ++n; wait[id] = {ok, no}; window.KK.postMessage(JSON.stringify({id, op, body: body || {}})); }); } };
})();
const closeApp = next => { KKB.call('close', next ? {next: true} : {}).catch(() => {}); };

/* ---------------- state ---------------- */
let D = null, view = 'boot', pins = [], time = -1, t0 = Date.now(), toastT = null;
let sheet = null, busy = false, acc = {step: 0, who: -1, lie: null, con: null, wit: []};
const P = () => D.puzzle, H = () => HOUSES[P().house];
const clockStart = () => (P().T === 5 ? 20 * 60 + 45 : 21 * 60);
const TT = () => [...Array(P().T)].map((_, i) => { const m = clockStart() + 15 * i; return fa(Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0')); });
const person = p => ({id: P().cast[p][0], role: P().cast[p][1], name: NAMES[P().cast[p][0]] || '؟', img: IMG[P().cast[p][0]]});
const byId = id => P().S.find(s => s.id === id);
const whoName = s => s.p >= 0 ? person(s.p).name : 'مدرک';
const roomN = (id, short) => { const r = H().rooms[id]; return r ? (short ? r[0] : r[1]) : id; };

/* ---------------- statements ---------------- */
function segs(s) {
  const T = TT(), v = ((+s.id.slice(1)) + (+P().id.slice(1))) % 2;
  const t = u => ({k: 't', x: T[u]}), r = id => ({k: 'r', x: roomN(id, true)}), y = q => ({k: 'p', x: person(q).name});
  const x = z => ({k: '', x: z});
  switch (s.kind) {
    case 'self': return [t(s.t), x(' تو '), r(s.r), x(' بودم؛ ' + ((ACT[s.r] || ['اون‌جا بودم', 'اون‌جا بودم'])[v]) + '.')];
    case 'alone': return v ? [t(s.t), x(' تو '), r(s.r), x(' تنها بودم.')] : [t(s.t), x(' تو '), r(s.r), x(' بودم و هیچ‌کس دیگه اون‌جا نبود.')];
    case 'saw': return v ? [t(s.t), x(' تو '), r(s.r), x(' بودم؛ '), y(s.y), x(' هم اون‌جا بود.')] : [t(s.t), x(' با '), y(s.y), x(' تو '), r(s.r), x(' بودیم.')];
    case 'only': return [t(s.t), x(' تو '), r(s.r), x(' فقط من بودم و '), y(s.y), x('.')];
    case 'heard': return v ? [t(s.t), x(' صدای '), y(s.y), x(' رو از '), r(s.r), x(' شنیدم.')] : [t(s.t), x(' از لای در '), y(s.y), x(' رو تو '), r(s.r), x(' دیدم.')];
    case 'absent': return [t(s.t), x(' تو '), r(s.r), x(' بودم؛ '), y(s.y), x(' اون‌جا نبود.')];
    case 'stayed': return [x('از '), t(s.t), x(' تا '), t(s.t2), x(' از '), r(s.r), x(' بیرون نیومدم.')];

      <div class="shields" role="img" aria-label="${fa(stars)} پلاک">${[0, 1, 2].map(i => SHIELD(i < stars)).join('')}</div>
      <div class="two"><div class="stat"><b>${mmss(sec)}</b><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9890" stroke-width="2" stroke-linecap="round" role="img" aria-label="زمان"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg></div>
        ${D.run.paid > 0 ? `<div class="stat"><b style="color:var(--brass)">+${fa(D.run.paid)}</b><i class="coin" role="img" aria-label="سکه"></i></div>` : `<div class="stat"><b>${fa(stars)}</b><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9890" stroke-width="1.8" role="img" aria-label="پلاک"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/></svg></div>`}</div>
      <div class="proof"><div style="font-size:12px;color:var(--inksoft);font-weight:900">دزد: ${esc(person(R.thief).name)}</div>${lie ? row(lie) : ''}${con ? '<hr>' + row(con) : ''}${wits.map(w => '<hr>' + row(w)).join('')}</div>
    </div>
    <div class="foot" style="flex-direction:column;gap:10px;padding-top:6px">
      ${nx ? `<button class="btn gold" style="justify-content:space-between;padding:0 18px" data-a="next-level"><span>معمای ${LEVEL_FA[nx.level]}</span>${nx.open || !nx.price ? '' : `<span class="pill"><i class="coin dk"></i>${fa(nx.price)}</span>`}</button>` : ''}
      <button class="btn ghost" data-a="share"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6E2DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg>فرستادن برای دوستان</button>
      <div class="next">معماهای تازه · فردا ساعت ۹ صبح</div></div></div>`;
}
function vFailed() {
  return `<div class="scr"><div class="bar"><button class="rbtn" data-a="close" aria-label="بستن"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6E2DA" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="res" style="justify-content:center"><div class="seal" style="margin-top:0"><span style="font-size:28px">بسته شد</span></div>
      <div style="font-weight:900;font-size:20px;text-align:center">سه بار اشتباه کردی</div>
      <div style="font-size:13.5px;color:var(--soft);text-align:center;max-width:280px;line-height:1.8">می‌تونی پرونده رو دوباره باز کنی. این بار فقط یه پلاک می‌گیری و سکه‌ای در کار نیست.</div></div>
    <div class="foot" style="flex-direction:column;gap:10px"><button class="btn gold" data-a="reopen"><i class="coin dk"></i>فرصت دوباره · ${fa(D.prices.reopen)} سکه</button><button class="btn ghost" data-a="close">بعداً</button></div></div>`;
}

/* ---------------- render + events ---------------- */
function render() {
  if (!D) return;
  $app.innerHTML = (view === 'intro' ? vIntro() : view === 'board' ? vBoard() : view === 'accuse' ? vAccuse() : view === 'result' ? vResult() : vFailed()) + (toastT ? `<div class="toast" role="status">${esc(toastT.m)}</div>` : '');
  const l = document.querySelector('.list'); if (l && render.scroll != null) l.scrollTop = render.scroll;
}
function toast(m) { toastT = {m}; render(); clearTimeout(toast.h); toast.h = setTimeout(() => { toastT = null; render(); }, 2600); }
const errText = e => ERR_FA[e] || ERR_FA.error;
function setD(r) { const keep = D && D.levels, ks = D && D.secs_shown; D = r; if (keep && !D.levels) D.levels = keep; if (ks && !D.secs_shown) D.secs_shown = ks; }

async function act(a, el) {
  const id = el && el.dataset.id, i = el && el.dataset.i != null ? +el.dataset.i : null;
  if (a === 'close') return closeApp(false);
  if (a === 'next-level') return closeApp(true);
  if (a === 'start') { view = 'board'; t0 = Date.now(); return render(); }
  if (a === 'sheetclose') { sheet = null; return render(); }
  if (a === 'hints') { sheet = 'hints'; return render(); }
  if (a === 'back') { if (!window.__kkBack()) closeApp(false); return; }
  if (a === 'time') { time = time === i ? -1 : i; return render(); }
  if (a === 'pin') { const at = pins.indexOf(id); if (at >= 0) pins.splice(at, 1); else { pins.push(id); if (pins.length > 3) pins.shift(); } const l = document.querySelector('.list'); render.scroll = l ? l.scrollTop : null; render(); render.scroll = null; return; }
  if (a === 'accuse') { acc = {step: 0, who: -1, lie: null, con: null, wit: []}; view = 'accuse'; return render(); }
  if (a === 'who') { acc.who = i; acc.lie = null; acc.con = null; acc.wit = []; return render(); }
  if (a === 'opt') {
    if (acc.step === 1) acc.lie = id; else if (acc.step === 2) acc.con = id;
    else { const at = acc.wit.indexOf(id); if (at >= 0) acc.wit.splice(at, 1); else { acc.wit.push(id); if (acc.wit.length > 2) acc.wit.shift(); } }
    return render();
  }
  if (a === 'next') { acc.step = Math.min(3, acc.step + 1); return render(); }
  if (busy) return;
  busy = true;
  try {
    if (a === 'buy') { setD(await KKB.call('hint', {kind: el.dataset.kind})); sheet = null; toast('راهنما گرفتی؛ یه پلاک از نتیجه کم می‌شه.'); }
    else if (a === 'reopen') { setD(await KKB.call('reopen', {})); view = 'board'; t0 = Date.now(); render(); }
    else if (a === 'share') { await KKB.call('share', {text: `کی کجا؟ · ${P().title}\n${fa(D.run.stars)} پلاک در ${mmss(D.run.secs || Math.round((Date.now() - t0) / 1000))}\nتو هم حلش کن!`}); }
    else if (a === 'submit') {
      const secs = Math.min(36000, Math.max(1, Math.round((Date.now() - t0) / 1000)));
      const r = await KKB.call('accuse', {who: acc.who, lie: acc.lie, con: acc.con, wit: acc.wit, secs});
      setD(r);
      if (r.ok) { D.secs_shown = secs; view = 'result'; render(); }
      else if (D.run.failed) { view = 'failed'; render(); }
      else { const s = r.step; acc.step = {who: 0, lie: 1, con: 2, wit: 3}[s] ?? 0; if (acc.step < 1) { acc.lie = null; acc.con = null; acc.wit = []; } if (acc.step < 2) { acc.con = null; acc.wit = []; } if (acc.step < 3) acc.wit = []; render(); toast(WRONG_FA[s] || 'اشتباه بود.'); }
    }
  } catch (e) { toast(errText(e)); }
  busy = false; render();
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el || (el.disabled)) return;
  if (el.classList.contains('ov') && ev.target !== el) return;     // taps inside a sheet stay in the sheet
  act(el.dataset.a, el);
});
window.__kkBack = () => {
  if (sheet) { sheet = null; render(); return true; }
  if (view === 'accuse') { if (acc.step > 0) acc.step--; else view = 'board'; render(); return true; }
  if (view === 'board') { view = 'intro'; render(); return true; }
  return false;
};

/* ---------------- start ---------------- */
async function boot() {
  try {
    setD(await KKB.call('state', {}));
    if (!D.puzzle) { $app.innerHTML = '<div class="spin">این معما هنوز باز نشده.</div>'; return; }
    t0 = Date.now();
    view = D.run.solved && D.reveal ? 'result' : D.run.failed ? 'failed' : (D.run.mistakes > 0 || (D.run.hints || []).length) ? 'board' : 'intro';
    render();
  } catch (e) { $app.innerHTML = `<div class="spin">${esc(errText(e))}</div>`; }
}
boot();
</script>
</body>
</html>
