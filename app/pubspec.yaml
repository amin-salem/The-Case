name: the_case
description: "پرونده - a daily Persian crime-mystery game."
publish_to: 'none'
version: 1.17.3+28

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.2.0
  share_plus: ^13.3.1
  audioplayers: ^6.1.0
  # local reminders at 21:00 / 22:30 (v20 needs Flutter 3.32+; v21+ would need 3.38+)
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.0
  myket_iap: ^1.1.11
  url_launcher: ^6.3.1
  # the version line at the bottom of Settings
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <8.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icon/
    - assets/portraits/
    - assets/scenes/
    - assets/avatars/
    - assets/banners/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
    - family: Sahel
      fonts:
        - asset: assets/fonts/Sahel.ttf
        - asset: assets/fonts/Sahel-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sahel-Black.ttf
          weight: 900
    - family: Shabnam
      fonts:
        - asset: assets/fonts/Shabnam.ttf
        - asset: assets/fonts/Shabnam-Bold.ttf
          weight: 700
    - family: Estedad
      fonts:
        - asset: assets/fonts/Estedad-Regular.ttf
        - asset: assets/fonts/Estedad-Bold.ttf
          weight: 700
        - asset: assets/fonts/Estedad-Black.ttf
          weight: 900
