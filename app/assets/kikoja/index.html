  --sheet:#E9E4D8; --sheet2:#D9D2C2; --sink:#222326; --sinkSoft:#615F5A; --kraft:#C9A15E; --kraftDark:#8A6A2E;
  --wall:#E9E4D8; --mapfloor:#a85346; --doorgap:#924a3f; --amber:#E0A526; --amber2:#FFE08A; --red:#D0543F; --ok:#5DAE7E; --line:#2B2D31;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(130% 80% at 50% 0%,#202124,#17181A 60%) fixed var(--bg);color:var(--ink);font-family:KV,Tahoma,system-ui,sans-serif;direction:rtl;margin:0;overflow-x:hidden}
q{quotes:"«" "»"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.screen{min-height:100%;max-width:560px;margin:0 auto;padding-inline:16px}
.display{font-family:KV,sans-serif;font-weight:900;letter-spacing:0}
.mute{color:var(--mute)}
.coins{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--amber)}
.coins i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE08A,#E0A526 55%,#8A6A2E);display:inline-block}

/* ---------- home ---------- */
#home{padding-block:20px 40px}
.hero{position:relative;padding:30px 0 18px}
.hero h1{font-size:46px;line-height:1.1;margin:0;color:var(--ink)}
.hero h1 b{color:var(--amber);font-weight:400}
.hero p{margin:10px 0 0;color:var(--mute);max-width:34ch;line-height:1.8}
.hero .coins{position:absolute;top:8px;left:0;padding:6px 12px 6px 10px;border-radius:999px;background:var(--floor);border:1px solid #E0A52680}
.plan-deco{height:92px;margin:16px 0 22px;border-radius:14px;background:
 linear-gradient(var(--line) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/16px 16px,var(--paper);
 position:relative;overflow:hidden;border:1px solid var(--line)}
.plan-deco svg{position:absolute;inset:0;width:100%;height:100%}
.nights{display:grid;gap:12px}
.night{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:right;padding:16px;border-radius:14px;background:var(--paper);border:1px solid var(--line);transition:transform .15s}
.night:active{transform:scale(.98)}
.night h3{margin:0;font-size:20px;font-weight:800}
.night .sub{grid-column:1;color:var(--mute);font-size:13px}
.night .side{grid-row:1/3;grid-column:2;display:grid;justify-items:end;gap:8px}
.diff{display:flex;gap:3px}
.diff i{width:16px;height:5px;border-radius:3px;background:var(--dim)}
.diff i.on{background:var(--amber)}
.stars{display:flex;gap:3px}
.stars .on{color:var(--amber)}
.night.fresh{border-style:dashed;background:transparent}
.night.fresh h3{color:var(--amber)}

/* ---------- intro ---------- */
#intro{padding-block:12px 120px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;height:52px;background:var(--bg)}
.iconbtn{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);font-size:18px;flex:none}
.topbar .title{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case-file{margin-top:18px;padding:22px 18px;border-radius:6px;background:var(--sheet);color:var(--sink);box-shadow:0 8px 18px #00000066;position:relative;overflow:hidden}
.case-file .kicker{font-size:12px;color:var(--red);font-weight:900}
.case-file h2{font-size:34px;margin:6px 0 12px}
.case-file p{line-height:2;margin:0}
.theft{display:flex;gap:12px;align-items:center;margin-top:18px;padding:12px 14px;border-radius:6px;background:var(--kraft);color:var(--sink)}
.theft .gem{font-size:26px}
.theft b{color:#3d2c0c;font-weight:900}
.rules{display:grid;gap:10px;margin:22px 0 0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;line-height:1.7}
.rules li span{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--floor);font-size:17px}
.cast{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.cast div{display:grid;justify-items:center;gap:4px;width:64px;text-align:center;font-size:12px}
.cast img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.cast small{color:var(--mute);font-size:10.5px;line-height:1.4}
.startbar{position:fixed;inset-inline:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);display:flex;justify-content:center;z-index:40}
.cta{width:100%;max-width:528px;height:54px;border-radius:14px;background:var(--red);color:#fff;font-weight:900;font-size:17px;box-shadow:0 6px 14px #D0543F59}
.cta:disabled{background:var(--floor);color:var(--dim);box-shadow:none}

/* ---------- game ---------- */
#game{padding-block:0 110px}
.dock{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-bottom:8px}
.dock .topbar{position:static}
.timer{font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px;min-width:44px;text-align:center}
.mapwrap{display:flex;justify-content:center}
.map{position:relative;width:100%;border-radius:6px;background:
 linear-gradient(#17181A26,#17181A26),var(--carpet) 0 0/110px repeat,var(--mapfloor);
 box-shadow:0 8px 18px #00000066;touch-action:manipulation;user-select:none}
.map svg.walls{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.room{position:absolute;display:block;text-align:center;border-radius:2px;transition:background .25s}
.room .lbl{position:absolute;top:5px;inset-inline:0;font-size:12px;color:#F3EBDD;font-weight:800;text-shadow:0 1px 3px #000a;pointer-events:none}
.room.flash{animation:flash .9s}
@keyframes flash{0%,100%{background:transparent}40%{background:#E0A52655}}
.room.target .lbl{color:var(--amber2)}
.room.hot{background:radial-gradient(circle at 50% 60%,#FFE08A40,transparent 72%)}
.room.bad{background:#17181A80;box-shadow:inset 0 0 0 2px #FF8A73}
.room .gem{position:absolute;bottom:4px;inset-inline-start:6px;font-size:13px;opacity:.55;pointer-events:none}
.room.hot .gem{opacity:1;filter:drop-shadow(0 0 6px var(--amber))}
.room.sel-hover{background:#ffffff0a}
.tok{position:absolute;width:var(--ts);height:var(--ts);border-radius:50%;transition:left .55s cubic-bezier(.3,.8,.3,1),top .55s cubic-bezier(.3,.8,.3,1),opacity .3s,transform .2s;z-index:3;pointer-events:none}
.tok img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #F3EBDD;box-shadow:0 2px 6px #000a;display:block;background:#222}
.tok.pin img{border-style:dashed;border-color:var(--amber2)}
.tok.bad img{border:2px solid #FFB4A6;box-shadow:0 0 0 3px #17181A,0 0 0 5px #FF8A73}
.tok.bad{animation:shake .4s}
.tok.sel img{box-shadow:0 0 0 3px var(--amber)}
.tok.thief img{border-color:var(--red);box-shadow:0 0 14px var(--red)}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.timebar{display:flex;gap:6px;margin-top:8px}
.slot{flex:1;height:48px;border-radius:11px;background:var(--paper);border:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums;position:relative;font-size:15px;color:var(--mute)}
.slot.on{background:var(--sheet);color:var(--sink);border-color:var(--sheet)}
.slot .dot{position:absolute;top:-4px;inset-inline-end:-3px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg)}
.slot .g{position:absolute;bottom:-7px;inset-inline:0;font-size:11px;line-height:1}
.slot.hint{box-shadow:0 0 0 2px var(--amber)}
.tray{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tray::-webkit-scrollbar{display:none}
.chip{flex:1 0 54px;display:grid;justify-items:center;gap:3px;padding:6px 2px 4px;border-radius:12px;border:1px solid transparent;font-size:11.5px;font-weight:600;color:var(--mute);transition:.15s}
.chip img{width:34px;height:34px;border-radius:50%;object-fit:cover;filter:grayscale(.55) brightness(.85);transition:.15s}
.chip.on{background:var(--paper);border-color:var(--amber);color:var(--ink)}
.chip.on img{filter:none;box-shadow:0 0 0 2px var(--amber)}
.chip.hint{color:var(--amber2)}
.chip.hint img{filter:none;box-shadow:0 0 0 2px var(--amber2),0 0 12px var(--amber)}
.chip.nudge{animation:nudge .5s}
@keyframes nudge{30%{transform:translateY(-4px)}}
.tip{font-size:12px;color:var(--mute);text-align:center;margin-top:4px;transition:opacity .3s}
.tip:empty{display:none}

.stmts{display:grid;gap:18px;margin-top:10px}
.who{display:grid;gap:8px}
.who-h{display:flex;align-items:center;gap:10px}
.who-h img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.who-h b{font-size:15px}
.who-h small{color:var(--mute);font-size:12px}
.say{display:grid;grid-template-columns:1fr 48px;align-items:center;gap:6px;padding:11px 12px 11px 6px;border-radius:6px;background:var(--sheet);color:var(--sink);border:1px solid transparent;line-height:1.9;font-size:15px;transition:.2s;box-shadow:0 6px 14px #00000055}
.say q{quotes:"«" "»"}
.say.pinned{background:#F0E2BE;border-inline-start:4px solid var(--kraftDark)}
.say .pinb{flex:none;width:48px;height:48px;border-radius:10px;display:grid;place-items:center;font-size:17px;filter:grayscale(1) opacity(.45)}
.say.pinned .pinb{filter:none;background:#8A6A2E22}
.say.badline{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 6px 14px #00000055}
.tk,.rk,.pk{font-weight:800;border-radius:6px;padding:0 3px;cursor:pointer}
.tk{color:var(--red);font-variant-numeric:tabular-nums}
.rk{color:var(--kraftDark)}
.pk{color:var(--sink);text-decoration:underline dotted #22232688;text-underline-offset:5px}
.sheet .tk,.choice .tk{color:var(--amber2)}
.closebar{position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%);display:flex;justify-content:center;z-index:25}

/* ---------- layers ---------- */
.layer{position:fixed;inset:0;z-index:60;background:#05070bcc;backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.layer.full{align-items:stretch;background:var(--bg);backdrop-filter:none;overflow-y:auto}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{margin:4px 0 12px;font-size:19px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--dim);margin:0 auto 10px}
.claim{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);line-height:1.8;font-size:14px}
.claim img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.claim .me{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--floor);font-size:13px}
.why{color:var(--red);font-weight:800;font-size:14px;margin-bottom:6px}
.hintopt{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;width:100%;text-align:right;padding:14px;border-radius:14px;background:var(--floor);margin-top:10px}
.hintopt small{grid-column:1;color:var(--mute)}
.hintopt .coins{grid-row:1/3;grid-column:2}
.hintopt:disabled{opacity:.45}

.acc{width:100%;max-width:560px;margin:0 auto;padding:0 16px 120px}
.steps{display:flex;gap:6px;margin:6px 0 18px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--amber)}
.acc h2{font-size:26px;margin:4px 0 4px}
.acc .lead{color:var(--mute);margin:0 0 16px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pick{display:grid;justify-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--paper);border:2px solid transparent;font-weight:800}
.pick img{width:72px;height:72px;border-radius:50%;object-fit:cover}
.pick.on{border-color:var(--red);background:#3a1d18}
.choice{display:block;width:100%;text-align:right;padding:13px 14px;border-radius:14px;background:var(--paper);border:2px solid transparent;margin-bottom:10px;line-height:1.9;font-size:15px}
.choice .from{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-bottom:2px}
.choice .from img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.choice.on{border-color:var(--red);background:#3a1d18}
.choice.on2{border-color:var(--amber);background:#3a2f15}
.verdict{position:fixed;inset-inline:16px;bottom:96px;max-width:528px;margin:0 auto;padding:14px 16px;border-radius:12px;background:#3a1d18;border:1px solid var(--red);font-weight:800;text-align:center;z-index:70;animation:up .25s}

.result{max-width:560px;margin:0 auto;padding:0 16px 140px}
.stamp{margin:20px auto 6px;width:fit-content;padding:4px 18px;border:3px solid var(--red);color:var(--red);border-radius:8px;transform:rotate(-6deg);font-size:30px;font-weight:900;font-family:KV,sans-serif}
.bigstars{display:flex;justify-content:center;gap:10px;font-size:40px;color:var(--dim);margin:10px 0}
.bigstars .on{filter:drop-shadow(0 0 10px #E0A52688);animation:pop .5s backwards}
.bigstars .on:nth-child(2){animation-delay:.15s}.bigstars .on:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}}
.statline{display:flex;justify-content:center;gap:22px;color:var(--mute);font-variant-numeric:tabular-nums}
.statline b{color:var(--ink)}
.replay-cap{text-align:center;min-height:56px;margin-top:10px;line-height:1.8}
.replay-cap .t{font-weight:800;color:var(--amber2);font-variant-numeric:tabular-nums}
.proof{margin-top:16px;display:grid;gap:10px}
.proof .q{padding:12px 14px;border-radius:14px;background:var(--paper);line-height:1.9;border-inline-start:3px solid var(--red)}
.proof .q.c{border-inline-start-color:var(--ok)}
.proof .q small{display:block;color:var(--mute);font-size:12px}
.proof p{line-height:2;margin:4px 0 0;color:var(--mute)}
.row2{display:flex;gap:10px}
.negb{position:absolute;bottom:3px;inset-inline-end:4px;display:flex;gap:2px;pointer-events:none}.negb i{width:20px;height:20px;border-radius:50%;background-size:cover;border:1.5px dashed #FF8A73;display:grid;place-items:center;font-style:normal;position:relative}.negb b{position:absolute;inset:0;border-radius:50%;background:#17181Aaa;color:#FF8A73;font-size:11px;display:grid;place-items:center}
.app #desk,.app #notebook,.app #houses,.app #me,.app .lg{display:none}
.appbar{display:flex;padding-top:8px}
.tools{display:flex;gap:8px;margin-top:6px}
.tools button{flex:1;min-height:48px;border-radius:12px;background:var(--paper);border:1px solid var(--line);color:var(--mute);font-size:13px;font-weight:700}
.tools button:disabled{opacity:.35}
.tools button.on{color:var(--amber2);border-color:var(--amber)}
.dock.fold .mapwrap,.dock.fold .tray,.dock.fold .tip{display:none}
.say.cmp{outline:2px solid var(--amber);outline-offset:-2px;border-radius:12px}
.srcnote{font-size:12.5px;color:var(--mute);text-align:center;margin-top:6px}
.ghost{flex:1;height:54px;border-radius:12px;border:1px solid #E6E2DA66;font-weight:700;background:transparent}
.toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));inset-inline:0;margin:0 auto;width:fit-content;max-width:90%;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:800;z-index:90;animation:up .2s}

.sec{margin:28px 0 10px;font-size:13px;color:var(--mute);font-weight:700;letter-spacing:.02em}
.daily{position:relative;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;width:100%;text-align:right;padding:22px 18px 18px;border-radius:6px;overflow:visible;margin-top:14px;
 background:var(--kraft);color:var(--sink);box-shadow:0 8px 18px #00000066}
.daily::before{content:'';position:absolute;top:-12px;inset-inline-start:0;width:42%;height:14px;background:var(--kraft);border-radius:6px 6px 0 0}
.daily .k{font-size:12px;color:#5a4214;font-weight:900}
.daily h3{margin:0;font-size:24px;font-weight:900}
.daily .sub{color:#5a4214;font-size:13px}
.daily .side{grid-row:1/4;grid-column:2;display:grid;justify-items:center;gap:6px}
.flame{display:grid;justify-items:center;font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;color:var(--sink)}
.flame span{font-size:30px;line-height:1;filter:drop-shadow(0 0 8px #E0A52688)}
.flame.off{color:var(--dim)}.flame.off span{filter:grayscale(1) opacity(.5)}
.houses{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.house{display:grid;gap:8px;text-align:right;padding:12px;border-radius:14px;background:var(--paper);border:1px solid var(--line);position:relative}
.house svg{width:100%;height:64px;display:block;background:var(--sheet);border-radius:4px}
.house .plancard{width:100%;aspect-ratio:16/9;border-radius:8px;display:grid;place-items:center;background:linear-gradient(#17181A33,#17181A33),var(--carpet) 0 0/80px,#a85346}
.house .plancard svg{width:72%;height:auto;max-height:86%;background:none}
.house.locked .plancard,.house.soon .plancard{filter:grayscale(1) brightness(.55)}
.house .xcov{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block}
.house .covbox{position:relative;border-radius:8px;overflow:hidden}
.house .covbox svg{position:absolute;inset-inline-start:6px;bottom:6px;width:34%;height:auto;background:#E9E4D8e6;border-radius:3px;padding:2px}
.house .nocov{width:100%;aspect-ratio:16/9;border-radius:8px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#2B2D31,#17181A)}
.house .nocov svg{position:static;width:38%;height:auto;background:#E9E4D8;padding:2px;border-radius:3px}
.house.locked .cov,.house.soon .cov{filter:grayscale(1) brightness(.6)}
.furn{position:absolute;bottom:6%;inset-inline-end:6%;width:34%;max-height:44%;object-fit:contain;opacity:.3;pointer-events:none}
.rug{position:absolute;inset:26% 18% 16%;border-radius:3px;background-size:40px;opacity:.14;pointer-events:none}
.hero-cover{position:relative;margin:0 -16px;aspect-ratio:16/9;max-height:260px;overflow:hidden}
.hero-cover:not([hidden]) + .case-file{margin-top:-48px}
.hero-cover img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(1.2)}
.hero-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 45%,var(--bg))}
.desk-img{margin:-16px -16px 0;aspect-ratio:16/7;background-size:cover;background-position:center 40%;border-radius:14px 14px 0 0;position:relative}
.desk-img::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--paper));border-radius:inherit}
.nb{grid-template-columns:1fr 76px;align-items:center}
.nb > *:not(.nbimg){grid-column:1}
.nbimg{grid-column:2;grid-row:1/4;width:76px;height:76px;border-radius:6px;object-fit:cover;box-shadow:0 4px 10px #0004}
.sheet .nbhead{width:calc(100% + 32px);margin:-6px -16px 14px;height:150px;object-fit:cover;display:block}
.house b{font-size:14px}
.house .st{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
.house.locked svg,.house.soon svg{opacity:.35;filter:grayscale(1)}
.house.soon{opacity:.6}
.house .lk{position:absolute;top:22%;inset-inline:0;text-align:center;font-size:26px;z-index:2}
.room{background:transparent}
.room.lit{background:radial-gradient(circle at 50% 58%,#FFE08A55,#FFE08A1a 60%,transparent 85%)}
.room.out::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 11px,#5a6f8c2e 11px 12px);background-size:100% 48px;animation:rain .55s linear infinite;pointer-events:none}
@keyframes rain{to{background-position:-12px 48px}}
.lockic{position:absolute;transform:translate(-50%,-50%);font-size:13px;z-index:4;pointer-events:none;filter:drop-shadow(0 0 4px #000);animation:pop .3s}
.facts .say{background:var(--kraft);box-shadow:0 6px 14px #00000055}
.facts .say .rk{color:#3d2c0c}
.facts .say.pinned{background:#D6B272}

<script>
// «نقشهٔ آن شب» — puzzle engine (pure; runs in the page and in node for tests)
const HOUSES = {
  qolhak: { name: 'خانهٔ باغِ قلهک', w: 300, h: 200, rooms: [
    { id: 'lib', n: 'کتابخانه', s: 'کتابخونه', x: 200, y: 0, w: 100, h: 100 },
    { id: 'salon', n: 'سالن', s: 'سالن', x: 100, y: 0, w: 100, h: 100 },
    { id: 'yard', n: 'حیاط', s: 'حیاط', x: 0, y: 0, w: 100, h: 100 },
    { id: 'study', n: 'اتاق کار', s: 'اتاق کار', x: 200, y: 100, w: 100, h: 100 },
    { id: 'hall', n: 'راهرو', s: 'راهرو', x: 100, y: 100, w: 100, h: 100 },
    { id: 'kitchen', n: 'آشپزخانه', s: 'آشپزخونه', x: 0, y: 100, w: 100, h: 100 } ],
    doors: [['lib','salon'],['salon','yard'],['salon','hall'],['lib','study'],['study','hall'],['hall','kitchen'],['kitchen','yard']] },
  kashan: { name: 'خانهٔ تاریخیِ کاشان', w: 300, h: 300, rooms: [
    { id: 'upper', n: 'بالاخانه', s: 'بالاخونه', x: 200, y: 0, w: 100, h: 100 },
    { id: 'porch', n: 'ایوان', s: 'ایوون', x: 100, y: 0, w: 100, h: 100 },
    { id: 'shah', n: 'شاه‌نشین', s: 'شاه‌نشین', x: 0, y: 0, w: 100, h: 100 },
    { id: 'kitchen', n: 'مطبخ', s: 'مطبخ', x: 200, y: 100, w: 100, h: 100 },
    { id: 'court', n: 'حیاط و حوض', s: 'حیاط', x: 100, y: 100, w: 100, h: 100 },
    { id: 'lib', n: 'کتابخانه', s: 'کتابخونه', x: 0, y: 100, w: 100, h: 100 },
    { id: 'store', n: 'انبار', s: 'انبار', x: 200, y: 200, w: 100, h: 100 },
    { id: 'hashti', n: 'هشتی', s: 'هشتی', x: 100, y: 200, w: 100, h: 100 },
    { id: 'guest', n: 'اتاق مهمان', s: 'اتاق مهمون', x: 0, y: 200, w: 100, h: 100 } ],
    doors: [['upper','porch'],['porch','shah'],['porch','court'],['court','kitchen'],['court','lib'],['court','hashti'],['kitchen','store'],['store','hashti'],['hashti','guest'],['lib','guest']] },
  train: { name: 'قطارِ شبِ مشهد', w: 500, h: 200, rooms: [
    { id: 'diner', n: 'رستوران', s: 'رستوران', x: 400, y: 0, w: 100, h: 200 },
    { id: 'c1', n: 'کوپهٔ ۱', s: 'کوپهٔ یک', x: 300, y: 0, w: 100, h: 110 },
    { id: 'c2', n: 'کوپهٔ ۲', s: 'کوپهٔ دو', x: 200, y: 0, w: 100, h: 110 },
    { id: 'c3', n: 'کوپهٔ ۳', s: 'کوپهٔ سه', x: 100, y: 0, w: 100, h: 110 },
    { id: 'c4', n: 'کوپهٔ ۴', s: 'کوپهٔ چهار', x: 0, y: 0, w: 100, h: 110 },
    { id: 'r1', n: 'راهرو', s: 'راهروی جلو', x: 300, y: 110, w: 100, h: 90 },
    { id: 'r2', n: 'راهرو', s: 'راهروی وسط', x: 200, y: 110, w: 100, h: 90 },
    { id: 'r3', n: 'راهرو', s: 'راهروی عقب', x: 100, y: 110, w: 100, h: 90 },
    { id: 'bag', n: 'واگنِ بار', s: 'واگنِ بار', x: 0, y: 110, w: 100, h: 90 } ],
    doors: [['diner','r1'],['r1','c1'],['r2','c2'],['r3','c3'],['bag','c4'],['r1','r2'],['r2','r3'],['r3','bag']] },
};

function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const pick = (r, a) => a[Math.floor(r() * a.length)];
function shuffle(r, a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function neighbours(house) {
  const nb = {}; for (const r of house.rooms) nb[r.id] = new Set([r.id]);
  for (const [a, b] of house.doors) { nb[a].add(b); nb[b].add(a); }
  return nb;
}

// cons: [person, slot, room, negative]
function feasible(cons, n, T, rooms, nb, locks) {
  for (let p = 0; p < n; p++) {
    const allow = []; let any = false;
    for (let t = 0; t < T; t++) allow.push(null);
    for (const [q, t, r, neg] of cons) if (q === p) { any = true; if (!allow[t]) allow[t] = { pos: new Set(), neg: new Set() }; (neg ? allow[t].neg : allow[t].pos).add(r); }
    if (!any) continue;
    let reach = null;
    for (let t = 0; t < T; t++) {
      let set;
      const a = allow[t];
      if (a && a.pos.size > 1) return false;
      if (a && a.pos.size === 1) set = new Set(a.pos); else set = new Set(rooms);
      if (a) for (const r of a.neg) set.delete(r);
      if (reach) { const nx = new Set(); for (const r of set) { for (const q of reach) if (nb[q].has(r) && !(locks && q !== r && locks.has(q + '|' + r + '|' + (t - 1)))) { nx.add(r); break; } } set = nx; }
      if (!set.size) return false;
      reach = set;
    }
  }
  return true;
}

function candidateOK(X, S, P) {
  const cons = [];
  for (const s of S) if (s.p !== X) cons.push(...s.cons);
  cons.push([X, P.k, P.target, false]);
  for (let q = 0; q < P.n; q++) if (q !== X) cons.push([q, P.k, P.target, true]);
  return feasible(cons, P.n, P.T, P.roomIds, P.nb, P.lockSet);
}
function pairUnsat(a, b, P) { return !feasible(a.cons.concat(b.cons), P.n, P.T, P.roomIds, P.nb, P.lockSet); }
function lockSetOf(locks) { const s = new Set(); for (const [a, b, t] of locks) { s.add(a + '|' + b + '|' + t); s.add(b + '|' + a + '|' + t); } return s; }
function trueOf(s, paths) { return s.cons.every(([p, t, r, neg]) => (paths[p][t] === r) !== neg); }
function suspects(S, P) { const out = []; for (let x = 0; x < P.n; x++) if (candidateOK(x, S, P)) out.push(x); return out; }

// every true thing person i can say
function truthPool(i, paths, P) {
  const out = [], n = P.n, T = P.T;
  for (let t = 0; t < T; t++) {
    const R = paths[i][t];
    const W = []; for (let q = 0; q < n; q++) if (q !== i && paths[q][t] === R) W.push(q);
    out.push({ p: i, kind: 'self', t, r: R, cons: [[i, t, R, false]] });
    if (!W.length) { const c = [[i, t, R, false]]; for (let q = 0; q < n; q++) if (q !== i) c.push([q, t, R, true]); out.push({ p: i, kind: 'alone', t, r: R, cons: c }); }
    for (const y of W) out.push({ p: i, kind: 'saw', t, r: R, y, cons: [[i, t, R, false], [y, t, R, false]] });
    if (W.length === 1) { const y = W[0]; const c = [[i, t, R, false], [y, t, R, false]]; for (let q = 0; q < n; q++) if (q !== i && q !== y) c.push([q, t, R, true]); out.push({ p: i, kind: 'only', t, r: R, y, cons: c }); }
    for (let y = 0; y < n; y++) if (y !== i && paths[y][t] !== R) {
      const Ry = paths[y][t];
      if (P.nb[R].has(Ry)) out.push({ p: i, kind: 'heard', t, r: Ry, y, cons: [[y, t, Ry, false]] });
      out.push({ p: i, kind: 'absent', t, r: R, y, cons: [[i, t, R, false], [y, t, R, true]] });
    }
  }
  for (let t = 0; t < T - 1; t++) {
    let e = t; while (e + 1 < T && paths[i][e + 1] === paths[i][t]) e++;
    if (e > t && (t === 0 || paths[i][t - 1] !== paths[i][t])) { const c = []; for (let u = t; u <= e; u++) c.push([i, u, paths[i][t], false]); out.push({ p: i, kind: 'stayed', t, t2: e, r: paths[i][t], cons: c }); }
  }
  for (const R of P.roomIds) if (!paths[i].includes(R)) { const c = []; for (let t = 0; t < T; t++) c.push([i, t, R, true]); out.push({ p: i, kind: 'never', r: R, cons: c }); }
  return out;
}

// physical evidence (always true): photos and dark rooms
function factPool(paths, P) {
  const out = [];
  for (let t = 0; t < P.T; t++) for (const R of P.roomIds) {
    const here = []; for (let q = 0; q < P.n; q++) if (paths[q][t] === R) here.push(q);
    if (R === P.target) continue;
    if (here.length) { const c = []; for (let q = 0; q < P.n; q++) c.push([q, t, R, !here.includes(q)]); out.push({ p: -1, kind: 'photo', t, r: R, ys: here, cons: c }); }
    else { const c = []; for (let q = 0; q < P.n; q++) c.push([q, t, R, true]); out.push({ p: -1, kind: 'dark', t, r: R, cons: c }); }
  }
  return out;
}

function lieCandidates(th, paths, P) {
  const out = [], T = P.T, n = P.n;
  for (let t = 0; t < T; t++) for (const R of P.roomIds) if (R !== paths[th][t] && R !== P.target) {
    out.push({ p: th, kind: 'self', t, r: R, cons: [[th, t, R, false]], w: t === P.k ? 3 : 1 });
    for (let z = 0; z < n; z++) if (z !== th) out.push({ p: th, kind: 'saw', t, r: R, y: z, cons: [[th, t, R, false], [z, t, R, false]], w: t === P.k ? 2 : 0.6 });
    if (t < T - 1) { const c = [[th, t, R, false], [th, t + 1, R, false]]; out.push({ p: th, kind: 'stayed', t, t2: t + 1, r: R, cons: c, w: (t === P.k || t + 1 === P.k) ? 2 : 0.5 }); }
  }
  for (let y = 0; y < n; y++) if (y !== th && paths[y][P.k] !== P.target) out.push({ p: th, kind: 'heard', t: P.k, r: P.target, y, cons: [[y, P.k, P.target, false]], w: 1.5 });
  { const c = []; for (let t = 0; t < T; t++) c.push([th, t, P.target, true]); out.push({ p: th, kind: 'never', r: P.target, cons: c, w: 1.5 }); }
  return out.filter(s => !trueOf(s, paths));
}

const KIND_W = {
  easy: { self: 3, saw: 3, alone: 2, only: 1, heard: 1, absent: 1, stayed: 1, never: 0.5 },
  medium: { self: 2, saw: 2, alone: 2, only: 1.5, heard: 2, absent: 1.5, stayed: 1.5, never: 1 },
  hard: { self: 1, saw: 1.5, alone: 2, only: 2, heard: 2.5, absent: 2, stayed: 2, never: 1.5 },
};
function wpick(r, arr, wf) { let tot = 0; for (const a of arr) tot += wf(a); let x = r() * tot; for (const a of arr) { x -= wf(a); if (x <= 0) return a; } return arr[arr.length - 1]; }

function randomPath(r, P, nb, fixT, fixR, avoidT, avoidR) {
  for (let tries = 0; tries < 80; tries++) {
    const path = new Array(P.T);
    if (fixT != null) {
      path[fixT] = fixR;
      for (let t = fixT + 1; t < P.T; t++) path[t] = r() < 0.3 ? path[t - 1] : pick(r, [...nb[path[t - 1]]]);
      for (let t = fixT - 1; t >= 0; t--) path[t] = r() < 0.3 ? path[t + 1] : pick(r, [...nb[path[t + 1]]]);
    } else {
      path[0] = pick(r, P.roomIds);
      for (let t = 1; t < P.T; t++) path[t] = r() < 0.35 ? path[t - 1] : pick(r, [...nb[path[t - 1]]]);
    }
    if (avoidT != null && path[avoidT] === avoidR) continue;
    if (new Set(path).size < Math.min(3, P.T - 1)) continue;
    return path;
  }
  return null;
}

function tryGen(cfg, r) {
  const house = HOUSES[cfg.house], nb = neighbours(house);
  const P = { n: cfg.n, T: cfg.T, k: cfg.k, target: cfg.target, roomIds: house.rooms.map(x => x.id), nb };
  const W = KIND_W[cfg.diff];
  const th = Math.floor(r() * P.n);
  const paths = [];
  for (let i = 0; i < P.n; i++) {
    const p = i === th ? randomPath(r, P, nb, P.k, P.target) : randomPath(r, P, nb, null, null, P.k, P.target);
    if (!p) return null; paths.push(p);
  }
  // a locked door (medium/hard): a door nobody's true path uses at that moment
  const locks = [];
  const nLocks = { easy: 0, medium: r() < 0.5 ? 1 : 0, hard: 1 }[cfg.diff];
  for (let a = 0; a < 30 && locks.length < nLocks; a++) {
    const [da, db] = pick(r, HOUSES[cfg.house].doors), t = Math.floor(r() * (P.T - 1));
    if (paths.some(p => (p[t] === da && p[t + 1] === db) || (p[t] === db && p[t + 1] === da))) continue;
    if (Math.abs(t - P.k) > 1 && r() < 0.6) continue;
    locks.push([da, db, t]);
  }
  P.locks = locks; P.lockSet = lockSetOf(locks);
  // the thief must look ordinary: not in the target room the whole night
  if (paths[th].filter(x => x === P.target).length > 2) return null;
  const pools = paths.map((_, i) => truthPool(i, paths, P));
  const facts = factPool(paths, P);
  const nFacts = { easy: 1, medium: 2, hard: 2 }[cfg.diff];
  // the lie, with at least one innocent statement that cannot stand beside it
  let lies = lieCandidates(th, paths, P), chosen = null;
  while (lies.length && !chosen) {
    const l = wpick(r, lies, x => x.w * (cfg.diff === 'hard' && x.kind !== 'self' ? 2 : 1));
    const contra = []; for (let i = 0; i < P.n; i++) if (i !== th) for (const s of pools[i]) if (pairUnsat(l, s, P)) contra.push(s);
    for (const f of facts) if (pairUnsat(l, f, P) && r() < 0.35) contra.push(f);
    if (contra.length) chosen = { l, contra }; else lies = lies.filter(x => x !== l);
  }
  if (!chosen) return null;
  const lie = chosen.l;
  const S = [lie];
  const contra = pick(r, chosen.contra); S.push(contra);
  const count = i => S.filter(s => s.p === i).length;
  const has = s => S.includes(s);
  if (r() < 0.6) {
    const ok = pools[th].filter(s => s.t !== P.k && s.r !== P.target && s.kind !== 'never' && s.kind !== 'stayed' && !pairUnsat(s, lie, P));
    if (ok.length) S.push(wpick(r, ok, s => W[s.kind]));
  }
  for (let i = 0; i < P.n; i++) if (i !== th && !count(i)) S.push(wpick(r, pools[i], s => W[s.kind]));
  const nf = () => S.filter(s => s.p === -1).length;
  const maxPer = 3;
  for (let guard = 0; guard < 40; guard++) {
    const alts = suspects(S, P).filter(x => x !== th);
    if (!alts.length) break;
    const X = pick(r, alts);
    const opts = [];
    for (let i = 0; i < P.n; i++) if (i !== X && i !== th && count(i) < maxPer) for (const s of pools[i]) if (!has(s) && !candidateOK(X, S.concat([s]), P)) opts.push(s);
    if (nf() < nFacts) for (const f of facts) if (!has(f) && !candidateOK(X, S.concat([f]), P)) { f.w2 = 4; opts.push(f); }
    if (!opts.length) return null;
    S.push(wpick(r, opts, s => s.p === -1 ? 3 : W[s.kind] / (1 + count(s.p))));
  }
  if (suspects(S, P).join() !== String(th)) return null;
  // prune to taste
  const pruneShare = { easy: 0.2, medium: 0.6, hard: 1 }[cfg.diff];
  for (const s of shuffle(r, S)) {
    if (s === lie || r() > pruneShare) continue;
    const S2 = S.filter(x => x !== s);
    if (s.p >= 0 && S2.filter(x => x.p === s.p).length < 1) continue;
    if (!S2.some(x => x.p !== th && pairUnsat(lie, x, P))) continue;
    if (suspects(S2, P).join() !== String(th)) continue;
    S.splice(S.indexOf(s), 1);
  }
  // pad with harmless true statements (not about the thief, not touching the lie) so each person has a voice
  const want = { easy: 2, medium: 2, hard: 1 }[cfg.diff];
  const wantTotal = P.n + { easy: 3, medium: 3, hard: 2 }[cfg.diff];
  for (let i of shuffle(r, [...Array(P.n).keys()])) {
    while (count(i) < want || (S.length < wantTotal && count(i) < 2)) {
      const opts = pools[i].filter(s => !has(s) && !s.cons.some(c => c[0] === th) && !pairUnsat(lie, s, P) && (i !== th || (s.t !== P.k && s.r !== P.target)));
      if (!opts.length) break;
      const s = wpick(r, opts, s => W[s.kind]);
      S.push(s);
      if (S.length >= wantTotal && count(i) >= want) break;
    }
  }
  for (const f of shuffle(r, facts)) { if (nf() >= nFacts) break; if (!has(f) && !f.cons.some(c => c[0] === th && !c[3]) && !pairUnsat(lie, f, P)) S.push(f); }
  if (suspects(S, P).join() !== String(th)) return null;
  for (let i = 0; i < P.n; i++) if (count(i) < 1 || count(i) > maxPer) return null;
  if (!S.some(x => x.p >= 0 && x.p !== th && pairUnsat(lie, x, P))) return null;
  if (cfg.diff === 'hard' && S.filter(x => x.p !== th && pairUnsat(lie, x, P)).length > 1) return null;
  if (cfg.diff !== 'easy' && contraWhoAlsoTrivial(S, lie, th, P)) return null;
  // hard: the lie must need a second step that uses the evidence or the lock
  if (cfg.diff === 'hard') {
    const noFacts = S.filter(x => x.p !== -1);
    if (suspects(noFacts, P).join() === String(th) && !locks.length) return null;
  }
  S.sort((a, b) => a.p - b.p || (a.t ?? -1) - (b.t ?? -1));
  S.forEach((s, i) => { s.id = 's' + i; delete s.w; delete s.w2; });
  return { cfg, house: cfg.house, n: P.n, T: P.T, k: P.k, target: P.target, thief: th, paths, S, lie: lie.id, locks };
}
// for medium/hard: the person who contradicts the lie must not be cleared by nothing at all
// (i.e. removing every other statement, he would still be a suspect) -> puzzle needs a second step
function contraWhoAlsoTrivial(S, lie, th, P) {
  const cs = S.filter(x => x.p !== th && pairUnsat(lie, x, P));
  // trivial if with only the lie + contradictors, the thief is already unique
  return suspects([lie, ...cs], P).join() === String(th);
}

function generate(cfg, seed) {
  for (let a = 0; a < 3000; a++) { const g = tryGen(cfg, rng(seed * 7919 + a * 104729 + 17)); if (g) { g.seed = seed; g.attempt = a; return g; } }
  return null;
}
function ctx(g) { const house = HOUSES[g.house]; return { n: g.n, T: g.T, k: g.k, target: g.target, roomIds: house.rooms.map(x => x.id), nb: neighbours(house), locks: g.locks || [], lockSet: lockSetOf(g.locks || []) }; }

if (typeof module !== 'undefined') module.exports = { lockSetOf, HOUSES, generate, ctx, pairUnsat, suspects, trueOf, neighbours, feasible };

}
function wordPlain(opts) {

  return `<div style="font-family:KV,sans-serif;font-weight:900;font-size:${o.size}px;line-height:1;color:${o.ink};direction:rtl">کی کجا</div>`;

}

    <div class="stamp display">پرونده بسته شد</div>

    <div class="statline"><span>زمان <b>${fa(Math.floor(st.secs / 60) + ':' + String(st.secs % 60).padStart(2, '0'))}</b></span><span>اشتباه <b>${fa(st.mistakes)}</b></span>${st.reward ? `<span class="coins"><i></i>+${fa(st.reward)}</span>` : ''}</div>
    ${N.daily && !APP ? `<div class="pct">${fa(312)} کارآگاه امروز حلش کردن؛ تو بینِ <b>٪${fa(Math.max(3, Math.min(90, Math.round(st.secs / 6))))}</b> سریع‌ترها بودی. <small>(نمونه)</small></div>` : ''}
    ${st.page ? `<div class="pct">📖 یک برگِ تازه به دفترچهٔ شکوهی اضافه شد (${fa(Math.min(21, store.get('pages', 0)) % 7 || 7)} از ${fa(7)}).</div>` : ''}
    <div class="mapwrap" style="margin-top:18px"><div class="map" id="rmap"></div></div>
    <div class="srcnote">یکی از مسیرهای سازگار با مدارک</div>
    <div class="replay-cap" id="rcap"></div>
    <div class="proof">${proofHtml(L, C)}</div>
    <div class="share" id="shareCard">${wordmark({ size: 30, ink: '#222326', bg: '#E9E4D8' })}<div class="big">دروغگو رو در <b>${fa(Math.floor(st.secs / 60) + ':' + String(st.secs % 60).padStart(2, '0'))}</b> گرفتم</div>
      ${starsHtml(st.stars)}<div style="width:52%">${planSvg(G.house, G.target)}</div><small>${N.daily ? 'شبِ امروز · ' : ''}${N.title} · ${HOUSES[G.house].name}</small></div>
    <div style="display:flex;justify-content:center;margin-top:10px"><button class="ghost" id="shareBtn" style="flex:0 1 340px">فرستادن برای دوستان</button></div>
    </div>
    <div class="startbar"><div class="row2" style="width:100%;max-width:528px"><button class="ghost" id="rAgain">دوباره ببین</button><button class="cta" id="rHome" style="flex:1.4">شبِ بعدی</button></div></div>`;
  const l = openLayer('result', html, true);
  if (replace !== undefined && stack[stack.length - 2] === 'accuse') { /* accuse -> result in place */ }
  const el = l.querySelector('#rmap');
  buildMap(el, { size: (() => { const H = HOUSES[G.house]; const w = Math.min(window.innerWidth - 32, 528); let h = w * H.h / H.w; const mh = window.innerHeight * 0.42; return h > mh ? { w: mh * H.w / H.h, h: mh } : { w, h }; })() });
  l.querySelector('#rAgain').onclick = () => replay(el, l);
  l.querySelector('#shareBtn').onclick = () => {
    const txt = `«${N.title}» رو در ${fa(Math.floor(st.secs / 60) + ':' + String(st.secs % 60).padStart(2, '0'))} حل کردم و دروغگو رو گرفتم. تو چقدر وقت می‌خوای؟ «کی کجا؟» توی بازی پرونده`;
    if (APP) { KKB.call('share', { text: txt }).catch(() => {}); return; }
    const done = () => toast('متن کپی شد؛ برای دوستت بفرست');
    try { navigator.clipboard.writeText(txt).then(done, () => toast(txt)); } catch (e) { toast(txt); }
  };
  l.querySelector('#rHome').onclick = () => { history.go(-(stack.length - 1)); };
  replay(el, l);
}
function replay(el, l) {
  clearInterval(replayTimer); let t = 0; const TT = times(G.T);
  const step = () => {
    const items = []; for (let p = 0; p < G.n; p++) items.push({ key: 'r' + p, p, room: G.paths[p][t], cls: p === G.thief && t === G.k ? 'thief' : '' });
    placeTokens(el, items);
    el.querySelectorAll('.room').forEach(d => d.classList.toggle('hot', d.dataset.room === G.target && t < G.k));
    const gem = el.querySelector('.room.target .gem'); if (gem) gem.style.opacity = t < G.k ? 1 : t === G.k ? 1 : 0.08;
    const cap = l.querySelector('#rcap');
    cap.innerHTML = `<div class="t">${TT[t]}</div>${t === G.k ? `<b style="color:var(--red)">${pname(G.thief)}</b> تنها در ${room(G.target).n}.` : t > G.k ? `${N.obj} دیگه سرِ جاش نیست.` : '&nbsp;'}`;
    if (t === G.k) SFX.thud(); else SFX.tick();
    t++; if (t >= G.T) clearInterval(replayTimer);
  };
  step(); replayTimer = setInterval(step, 1500);
}

/* the result layer replaces the accuse layer in history */
const _openLayer = openLayer;
openLayer = function (name, html, full) {
  if ((name === 'result' || name === 'fail') && stack[stack.length - 1] === 'accuse') { document.querySelector('#layers > [data-name="accuse"]')?.remove(); stack[stack.length - 1] = name; history.replaceState({ d: stack.length, s: stack.slice() }, ''); }
  return _openLayer(name, html, full);
};

window.addEventListener('resize', () => { if (G && stack[stack.length - 1] === 'game') { $('#map').__size = null; renderMap(); } });
renderHome();
if (APP) refreshSrv();
if (!store.get('tutDone', false) && !Object.keys(store.get('sessions', {})).length) setTimeout(() => openNight(NIGHTS[0]), 50);
</script>
